// 源文件：src/commonfile/fileproto/fileprotov2/protos/filev2.proto
// 所属仓库：any-sync
// proto 包：filesyncv2
// 服务：FileV2
// RPC 数量：5
// 说明：由 scripts/translate-proto.py 生成；字段名、编号、类型保持原样，注释译为中文。
// ============================================================

syntax = "proto3";
package filesyncv2;

option go_package = "commonfile/fileproto/fileprotov2";

// FileV2 是 v2 filenode broker (S3-direct uploads/downloads).
//
// drpc route prefix 是 "/filesyncv2.FileV2/..." — DISTINCT 来自 v1
// "/filesync.文件/..." so both services 可 被 mounted 在 相同 drpc mux
// without a Register() panic. package/service names 是 load-bearing:
// method paths 是 derived 来自 `package filesyncv2` + `service FileV2`.
//
// Conventions (所有 four SPACE-SCOPED RPCs 是 BATCH; Info 是 node-level):
// * 请求 carries a single shared spaceId (or 重复 spaceIds 用于
// SpaceInfo) + a 重复 列表 的 items;
// * 身份 是 NEVER a 请求 字段 — it 是 taken 来自 authenticated
// connection, and 所有 per-space/per-cid authorization derives 来自 it;
// * rootCid 是 bytes (raw self-describing CID, as 在 v1's `bytes cid`);
// * every result echoes 其 own 密钥 (rootCid bytes, or spaceId string) so
// clients build map[string(密钥)]->result 在 one pass — results 是 matched
// by 密钥, NEVER by positional 索引; server 可能 reorder/dedupe;
// * per-item result = flat 状态 enum (ErrCode, Ok=0) + exactly one typed
// 载荷 消息 ， 是 valid 仅 when 代码 == Ok;
// 【原文】* one bad/forbidden item never fails the whole batch.
//
// Two 错误 layers:
// 1. whole-RPC drpc 错误 (err != nil), carrying an ErrCodes value 来自
// offset-800 rpcerr registry, returned 仅 用于 cross-cutting failures:
// failed/absent auth (Forbidden), 格式错误 input (InvalidRequest), an
// 【原文】over-sized batch (QuerySizeExceeded), or a misrouted single-space
// 请求 (NotResponsible — retry against space's responsible pair);
// 2. per-item business outcome lives 在 in-body ErrCode `代码` 字段
// (err == nil 用于 RPC as a whole).
service FileV2 {
// Upload issues a presigned upload target per requested 文件 root.
    rpc Upload(UploadRequest) returns (UploadResponse);
// 【原文】RequestSign returns a network-signed durable-custody receipt per rootCid.
    rpc RequestSign(RequestSignRequest) returns (RequestSignResponse);
// 【原文】RequestDownload returns a signed GET target per rootCid.
    rpc RequestDownload(RequestDownloadRequest) returns (RequestDownloadResponse);
// SpaceInfo returns quota/usage per requested 空间 (batch quota-info).
    rpc SpaceInfo(SpaceInfoRequest) returns (SpaceInfoResponse);
// Info returns static node-level metadata (无 spaceId, 无 responsibility
// gate, 无 auth beyond connection); clients cache it.
    rpc Info(InfoRequest) returns (InfoResponse);
}

// ErrCodes 是 WHOLE-RPC (drpc-level) 错误, mirroring v1 filesync.ErrCodes.
// Wired through rpcerr.ErrGroup(ErrCodes_ErrorOffset) 在 fileprotov2err
// package. Returned as a NON-nil drpc 错误 仅 用于 auth / 格式错误 /
// batch-too-large / misrouted. Never 使用 到 report outcome 的 an
// individual item (， 是 per-item ErrCode below). Zero value
// Unexpected=0 registers at 偏移+0 (=800), so an uncoded server fault reads
// as Unexpected — exactly as v1 does at 200. 偏移 800 是 仅 free
// rpcerr block (v1=200, 100/300/400/500/600/700 是 taken).
enum ErrCodes {
    Unexpected = 0;         // 【原文】unclassified server fault (registry fallback)
    Forbidden = 1;          // connection 身份 是 不 permitted at 所有
    InvalidRequest = 2;     // 格式错误: 空 spaceId, 空 items, bad rootCid bytes
    QuerySizeExceeded = 3;  // batch too large (too many items 在 one 请求)
    NotResponsible = 4;     // retryable routing signal: 该 节点 是 不 在 space's chash pair
    ErrorOffset = 800;      // rpcerr.ErrGroup base 用于 v2 (constant, never an 错误)
}

// ErrCode 是 PER-ITEM, in-body business outcome (err == nil at RPC
// layer). Flat 状态 enum 带有 an explicit success sentinel Ok=0. typed
// 载荷 在 a *Result 是 valid 仅 when 代码 == Ok. Deliberately a SEPARATE
// enum 来自 ErrCodes: 其 zero value means success (不 错误), it never flows
// through rpcerr, and 其 value short-names 是 kept disjoint 来自 ErrCodes so
// proto3's package-level enum-value scoping stays clean. Servers 必须 set
// `代码` explicitly 在 every result (Ok 是 proto3 默认, so an unset
// 代码 would 被 misread as a success 带有 an 空 载荷).
enum ErrCode {
    Ok = 0;                 // item succeeded; typed 载荷 是 populated
    ErrUnexpected = 1;      // internal 错误 handling 该 single item
    ErrCidNotFound = 2;     // sign/download: 无 such stored 文件 用于 该 rootCid
    ErrForbidden = 3;       // 身份 可能 不 access 该 item's 空间/文件
    ErrLimitExceeded = 4;   // upload rejected: 空间/账户 storage 限制 reached
    ErrSpaceNotFound = 5;   // quota-info: unknown/deleted 空间 ID
    ErrNotResponsible = 6;  // retryable routing signal: 该 节点 是 不 在 该 item's 空间 chash pair
}

// 【原文】---- Upload ---------------------------------------------------------------

message UploadRequest {
    string spaceId = 1;                    // shared 空间 用于 every item (auth scope)
    repeated UploadRequestItem items = 2;  // 文件 到 obtain an upload target 用于
}

message UploadRequestItem {
    bytes rootCid = 1;  // CID 的 文件 root (result match 密钥)
    uint64 size = 2;    // declared total byte 大小 的 文件
}

message UploadResponse {
    repeated UploadResult results = 1;  // 【原文】one per requested item, keyed by rootCid
}

message UploadResult {
    bytes rootCid = 1;           // echoes UploadRequestItem.rootCid (match 密钥)
    ErrCode code = 2;            // per-item outcome; `upload` valid 仅 when Ok
    PresignedUpload upload = 3;  // set 仅 when 代码 == Ok
}

// PresignedUpload 是 an OPAQUE presigned upload target. 无 S3 vendor structs
// leak 写入 shared proto: client POSTs `fields` + 对象 body 到
// `url` verbatim. Modeled as a presigned POST form (fields 是 ordered
// 密钥/value pairs rather than a map) so signing order 是 deterministic and
// 【原文】reproducible.
message PresignedUpload {
    string url = 1;                    // 【原文】presigned POST endpoint
    repeated PresignField fields = 2;  // multipart form fields 到 send verbatim, 在 order
    uint64 maxContentLength = 3;       // 【原文】hard upper bound the presign enforces (bytes)
    int64 expiry = 4;                  // unix seconds; POST 必须 complete before 该
}

message PresignField {
    string key = 1;
    string value = 2;
}

// 【原文】---- RequestSign ----------------------------------------------------------

message RequestSignRequest {
    string spaceId = 1;           // shared 空间 用于 every rootCid (auth scope)
    repeated bytes rootCids = 2;  // 文件 到 obtain a durable-custody receipt 用于
}

message RequestSignResponse {
    repeated RequestSignResult results = 1;  // 【原文】one per rootCid, keyed by rootCid
}

message RequestSignResult {
    bytes rootCid = 1;               // echoes requested rootCid (match 密钥)
    ErrCode code = 2;                // per-item outcome; `receipt` valid 仅 when Ok
    NetworkSignReceipt receipt = 3;  // set 仅 when 代码 == Ok
}

// 【原文】NetworkSignReceipt mirrors coordinator SpaceReceiptWithSignature: an opaque
// protobuf-encoded 载荷 plus network-key 签名 over it. 载荷
// schema 是 intentionally 不 defined here (opaque blob forwarded verbatim).
message NetworkSignReceipt {
    bytes receiptPayload = 1;  // protobuf-encoded signed receipt 载荷 (opaque)
    bytes signature = 2;       // network 密钥 签名 over receiptPayload
}

// 【原文】---- RequestDownload ------------------------------------------------------

message RequestDownloadRequest {
    string spaceId = 1;           // shared 空间 用于 every rootCid (auth scope)
    repeated bytes rootCids = 2;  // 文件 到 obtain a signed GET target 用于
}

message RequestDownloadResponse {
    repeated RequestDownloadResult results = 1;  // 【原文】one per rootCid, keyed by rootCid
}

message RequestDownloadResult {
    bytes rootCid = 1;            // echoes requested rootCid (match 密钥)
    ErrCode code = 2;             // per-item outcome; `download` valid 仅 when Ok
    SignedDownload download = 3;  // set 仅 when 代码 == Ok
}

// SignedDownload 是 an OPAQUE signed GET target (kept as a 消息, symmetric
// 带有 PresignedUpload, so download 可 grow 响应 headers etc. without a
// wire break 在 result envelope).
message SignedDownload {
    string url = 1;    // 【原文】opaque signed GET url
    int64 expiry = 2;  // unix seconds url 是 valid until
}

// 【原文】---- SpaceInfo (batch quota-info) -----------------------------------------

message SpaceInfoRequest {
    repeated string spaceIds = 1;  // batch 的 空间 到 report 在 (result match 密钥)
}

message SpaceInfoResponse {
    repeated SpaceInfoResult results = 1;  // one per requested 空间, keyed by spaceId
}

message SpaceInfoResult {
    string spaceId = 1;    // echoes requested spaceId (match 密钥)
    ErrCode code = 2;      // per-item outcome; `quota` valid 仅 when Ok
    SpaceQuota quota = 3;  // set 仅 when 代码 == Ok
}

message SpaceQuota {
    uint64 limitBytes = 1;          // effective storage 限制 用于 requester 在 该 空间
    uint64 totalUsageBytes = 2;     // 【原文】counted usage == durableUsageBytes + inflightUsageBytes
    uint64 durableUsageBytes = 3;   // bytes fully committed 到 durable storage
    uint64 inflightUsageBytes = 4;  // 【原文】bytes reserved by presigned/not-yet-committed uploads
    uint64 filesCount = 5;          // number 的 文件 roots stored 在 空间
// account-pool view 用于 requesting 身份 (文件 是 charged 到
// their uploader; 所有 identity's 空间 share one pool). Zero when
// 节点 has 无 coordinator-backed 限制 (self-hosted fallback).
    uint64 accountLimitBytes = 6;   // 【原文】the identity's total file-storage cap
    uint64 accountUsageBytes = 7;   // aggregated durable usage across identity's 空间
}

// 【原文】---- Info (node-level metadata) ---------------------------------------------

// InfoRequest 是 deliberately 空: Info 是 static 节点 metadata,
// extensible later (capabilities, 限制) without a wire break.
message InfoRequest {}

message InfoResponse {
// publicReadBaseUrl, when non-empty, lets clients construct durable 对象
// URLs as {publicReadBaseUrl}/blob/{spaceId}/{rootCid} 带有 zero broker
// round-trips; clients cache it. 空 = 无 公开 read: use RequestDownload.
    string publicReadBaseUrl = 1;
}
