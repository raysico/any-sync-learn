// Pubsub 是 an ephemeral, fire-and-forget, at-most-once publish/subscribe
// channel scoped 到 a 空间. Messages 是 end-to-end encrypted 带有
// space's 当前 ACL read 密钥 ( 相同 密钥 encrypting 对象 changes) and
// signed 带有 sender's 账户 密钥. Nothing 是 persisted: subscribers
// 仅 receive messages published while they 是 subscribed.
// Received messages 是 delivered as Event.Pubsub.消息 在 event stream.
    message Pubsub {
// Publish sends one 消息 到 a fully-qualified topic within a 空间.
// Topics 是 '/'-separated hierarchies (max 16 segments, 256 bytes,
// 无 leading '/', 无 '*' or '>' characters). Topics 带有 reserved
// prefix "acc/" 是 publishable 仅 by 账户 whose ID equals
// topic's 最后一个 segment (spoof-proof per-account channels).
        message Publish {
            message Request {
                string spaceId = 1;
                string topic = 2;    // fully-qualified topic, wildcards 不 allowed
                bytes payload = 3;   // app 载荷; encrypted before leaving device
            }
            message Response {
                Error error = 1;
                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0;
                        UNKNOWN_ERROR = 1;
                        BAD_INPUT = 2;  // 格式错误 topic, 超大 载荷, 不 a topic owner
                    }
                }
            }
        }

// Subscribe registers interest 在 topic patterns within a 空间 under a
// subscription ID. Patterns 可能 use NATS-style wildcards: '*' matches
// 【原文】exactly one segment ("chat/*/typing"), '>' matches one-or-more
// trailing segments ("chat/>", tail position 仅). Matching messages
// arrive as Event.Pubsub.消息 carrying matched subIds.
// Subscribing an existing subId replaces 其 pattern set.
        message Subscribe {
            message Request {
                string spaceId = 1;
                repeated string topics = 2;  // 【原文】concrete topics or wildcard patterns
                string subId = 3;            // client-chosen ID; generated when 空
            }
            message Response {
                Error error = 1;
                string subId = 2;  // echoes 请求 subId or generated one
                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0;
                        UNKNOWN_ERROR = 1;
                        BAD_INPUT = 2;  // 格式错误 pattern or too many patterns
                    }
                }
            }
        }

// Unsubscribe drops subscription and withdraws interest 在 patterns
// 无 other subscription uses.
        message Unsubscribe {
            message Request {
                string subId = 1;
            }
            message Response {
                Error error = 1;
                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0;
                        UNKNOWN_ERROR = 1;
                        BAD_INPUT = 2;  // 【原文】unknown subId
                    }
                }
            }
        }
    }

