// 【原文】ListModels validates a provider config (base URL + token) and
// returns models it offers. A successful 响应 already proves
// endpoint 是 reachable and token works, so there 是 无
// separate "validate" RPC: model 列表 是 validation result,
// and 错误 代码 below (ENDPOINT_不_REACHABLE, AUTH_必需,
// ...) tell caller what 到 fix.
//
// config.model 是 ignored: at 该 point caller does 不 know
// 其 model 到 use yet.
        message ListModels {
            message Request {
                ProviderConfig config = 1;
            }

            message Response {
                Error error = 1;
                repeated Model models = 2;

                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0;
                        UNKNOWN_ERROR = 1;
                        BAD_INPUT = 2;

                        RATE_LIMIT_EXCEEDED = 100;
                        ENDPOINT_NOT_REACHABLE = 101;
                        MODEL_NOT_FOUND = 102;
                        AUTH_REQUIRED = 103;
// 【原文】...
                    }
                }
            }

// Model 是 one catalog entry, trimmed 到 what a client-side model
// picker needs: an ID 到 send back as ProviderConfig.model, plus
// 【原文】whatever attribution the provider gives alongside it.
//
// 用于 OPENAI 列表 是 pre-filtered 到 models usable 用于 chat
// completions (see FilterChatModels 在 core/ai/llmclient). 用于
// every other provider it 是 returned as-is: OLLAMA, LMSTUDIO and
// LLAMACPP 仅 ever 列表 what 用户 chose 到 pull/load onto
// ， server, so there 是 nothing irrelevant 到 filter out, and
// 无 capability 字段 到 filter by even 如果 there 曾是 (see
// FilterChatModels' doc comment 用于 evidence).
            message Model {
                string id = 1;
                string ownedBy = 2;
            }
        }

        message ProviderConfig {
            Provider provider = 1;
            string endpoint = 2;
            string model = 3;
            string token = 4;
            float temperature = 5;
        }

        enum Provider {
            OLLAMA = 0;
            OPENAI = 1;
            LMSTUDIO = 2;
            LLAMACPP = 3;
// 【原文】...
        }
    }

