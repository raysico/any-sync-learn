// ImportRunStatus reports one importv2 run by 其 durable importId
// 【原文】(returned nowhere yet client-side; discover via ImportRunList).
// Live runs 是 served 来自 running engine's surface; dormant
// 【原文】runs — a crashed process's dir awaiting the sweep, a suspended
// run — 是 served 来自 manifest and ledger alone, 其 是
// 【原文】what makes the poll restart-proof (a server-side
// operator polls job state instead 的 holding a session stream open
// 【原文】across sidecar restarts).
        message ImportRunStatus {
            message Request {
                string importId = 1;
            }

// Run pairs statistic 载荷 带有 durable lifecycle
// 【原文】state and liveness.
            message Run {
                anytype.Event.Import.Statistic status = 1;
// 【原文】the manifest lifecycle state (running | fetched |
// 【原文】materializing | suspended | compensating | completed |
// 【原文】failed)
                string manifestState = 2;
// an engine 在 该 process 是 running it right now
                bool live = 3;
            }

            message Response {
                Error error = 1;
                Run run = 2;

                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0;
                        UNKNOWN_ERROR = 1;
                        BAD_INPUT = 2;
                        NOT_FOUND = 3;
                    }
                }
            }
        }

// 【原文】ImportRunList enumerates every known importv2 run — live ones and
// 【原文】dormant run dirs. A sibling RPC rather than an empty-id overload
// 的 ImportRunStatus by design.
        message ImportRunList {
            message Request {}

            message Response {
                Error error = 1;
