                        BAD_INPUT = 2;

                        NOT_LOGGED_IN = 3;
                        PAYMENT_NODE_ERROR = 4;
                        CACHE_ERROR = 5;

                        EMAIL_ALREADY_VERIFIED = 6;
                        CODE_EXPIRED = 7;
                        CODE_WRONG = 8;

                        MEMBERSHIP_NOT_FOUND = 9;
                        MEMBERSHIP_ALREADY_ACTIVE = 10;
                        CAN_NOT_CONNECT = 11;
                    }
                }
            }
        }

        /**
        * Tiers 可 change 在 backend so 如果 you want 到 show 用户 latest data
        * you 可 call 该 method 到 get latest tiers
        */
        message GetTiers {
            message Request {
