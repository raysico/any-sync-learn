// RecoveryState serves folded 账户 start-up 状态
// (Event.账户.Recovery.快照) 来自 相同 state
// Event.账户.Recovery.Update stream 是 emitted 来自. Lock-free 带有
// respect 到 AccountSelect, so it 可 被 called while ， RPC blocks,
// and total: call it whenever you like. Before 任意 run it returns
// idle 快照 (runId 空, phase NotStarted); 账户_是_不_RUNNING
