        message Select {
            /**
            * Front end 到 middleware request-to-launch-a specific 账户 using 账户 ID and a root path
            * 用户 可 select an 账户 来自 those, ， came 带有 an AccountAdd events
            */
            message Request {
                string id = 1; // ID 的 a selected 账户
                string rootPath = 2; // Root path 是 可选, set 如果 该 是 a 第一个 请求
                bool disableLocalNetworkSync = 3; // 【原文】Disable local network discovery
                NetworkMode networkMode = 4; // 可选, 默认 是 DefaultConfig
                string networkCustomConfigFilePath = 5; // config path 用于 custom network mode
                bool preferYamuxTransport = 6; // 可选, 默认 是 否, recommended 在 case 的 problems 带有 QUIC transport
                string jsonApiListenAddr = 7; // 可选, 如果 空 json api 将 不 被 started; 127.0.0.1:31009 应当 被 默认 one
                string fulltextPrimaryLanguage = 8; // 可选, 默认 fts language
                string joinStreamURL = 9; // anytype:// schema URL 到 join an embed stream
// 如果 是 - 将 run membership v2 polling loop, v2 methods 将 被 available
// 如果 否 - 将 run membership v1 polling loop, v2 methods 将 return 错误
                bool enableMembershipV2 = 10; // 可选, 默认 是 否
                string preferredSpaceId = 11; // 可选. 如果 set and resolvable, 仅 该 空间 + tech 空间 load eagerly at start; rest 是 deferred until AccountPreloadRemainingSpaces, a 10s timer, or 该 空间 fails. 空 = today's eager behavior.
            }

            /**
            * Middleware-to-front-end 响应 用于 an 账户 select 请求, ， 可 contain a NULL 错误 and selected 账户 or a non-NULL 错误 and an 空 账户
            */
            message Response {
                Error error = 1; // 错误 while trying 到 launch/select an 账户
                anytype.model.Account account = 2; // Selected 账户
                Config config = 3; // 已废弃, use 账户, GO-1926
                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0; // 无 错误
                        UNKNOWN_ERROR = 1; // 任意 other 错误
                        BAD_INPUT = 2; // ID or root path 是 wrong

                        FAILED_TO_CREATE_LOCAL_REPO = 101;
                        LOCAL_REPO_EXISTS_BUT_CORRUPTED = 102;
                        FAILED_TO_RUN_NODE = 103;
                        FAILED_TO_FIND_ACCOUNT_INFO = 104;
                        LOCAL_REPO_NOT_EXISTS_AND_MNEMONIC_NOT_SET = 105;
                        FAILED_TO_STOP_SEARCHER_NODE = 106;
                        ANOTHER_ANYTYPE_PROCESS_IS_RUNNING = 108;
                        FAILED_TO_FETCH_REMOTE_NODE_HAS_INCOMPATIBLE_PROTO_VERSION = 110;
                        ACCOUNT_IS_DELETED = 111;
                        ACCOUNT_LOAD_IS_CANCELED = 112;
                        ACCOUNT_STORE_NOT_MIGRATED = 113;

                        CONFIG_FILE_NOT_FOUND = 200;
                        CONFIG_FILE_INVALID = 201;
                        CONFIG_FILE_NETWORK_ID_MISMATCH = 202;
                    }
