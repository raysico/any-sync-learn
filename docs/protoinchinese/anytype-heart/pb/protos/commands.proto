// ============================================================
// 源文件：src/pb/protos/commands.proto
// 所属仓库：anytype-heart
// proto 包：anytype
// 服务：（无 service，仅 message 定义）
// RPC 数量：0
// 说明：由 scripts/translate-proto.py 生成；字段名、编号、类型保持原样，注释译为中文。
// ============================================================

syntax = "proto3";
package anytype;
option go_package = "pb";

import "pkg/lib/pb/model/protos/models.proto";
import "pkg/lib/pb/model/protos/localstore.proto";
import "pkg/lib/pb/model/protos/export_report.proto";

import "pb/protos/events.proto";
import "google/protobuf/struct.proto";


import "google/protobuf/descriptor.proto";

/*
 * Rpc 是 a namespace, ， agregates 所有 的 service commands between client and middleware.
 * Structure: Topic > Subtopic > Subsub... > Action > (请求, 响应).
 * 请求 – 消息 来自 a client.
 * 响应 – 消息 来自 a middleware.
*/
message Rpc {
    message App {
        message GetVersion {
            message Request {
            }
            message Response {
                Error error = 1;
                string version = 2;
                string details = 3; // 【原文】build date, branch and commit

                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0;
                        UNKNOWN_ERROR = 1;
                        BAD_INPUT = 2;
                    }
                }
            }
        }
        message SetDeviceState {
            message Request {
                DeviceState deviceState = 1;

                enum DeviceState {
                    BACKGROUND = 0; // went 到 background 在 mobile, hibernated 在 desktop
                    FOREGROUND = 1; // went 到 foreground 在 mobile, woke 来自 hibernation 在 desktop
                }
            }

            message Response {
                Error error = 1;

                message Error {
                    Code code = 1;
                    string description = 2;
                    enum Code {
                        NULL = 0;
                        UNKNOWN_ERROR = 1;
                        BAD_INPUT = 2;
                    }
                }

            }
        }


        message Shutdown {
            message Request {
            }
            message Response {
                Error error = 1;

                message Error {
                    Code code = 1;
                    string description = 2;
                    enum Code {
                        NULL = 0;
                        UNKNOWN_ERROR = 1;
                        BAD_INPUT = 2;
                    }
                }

            }
        }
    }

    message Space {
        message LeaveApprove {
            message Request {
                string spaceId = 1;
                repeated string identities = 2;
            }

            message Response {
                Error error = 1;

                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0;
                        UNKNOWN_ERROR = 1;
                        BAD_INPUT = 2;

                        NO_SUCH_SPACE = 101;
                        SPACE_IS_DELETED = 102;
                        REQUEST_FAILED = 103;
                        LIMIT_REACHED = 104;
                        NO_APPROVE_REQUESTS = 105;
                        NOT_SHAREABLE = 106;
                    }
                }
            }
        }

        message MakeShareable {
            message Request {
                string spaceId = 1;
            }

            message Response {
                Error error = 1;

                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0;
                        UNKNOWN_ERROR = 1;
                        BAD_INPUT = 2;

                        NO_SUCH_SPACE = 101;
                        SPACE_IS_DELETED = 102;
                        REQUEST_FAILED = 103;
                        LIMIT_REACHED = 104;
                    }
                }
            }
        }

        message InviteChange {
            message Request {
                string spaceId = 1;
                model.ParticipantPermissions permissions = 2;
            }

            message Response {
                Error error = 1;

                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0;
                        UNKNOWN_ERROR = 1;
                        BAD_INPUT = 2;

                        NO_SUCH_SPACE = 101;
                        SPACE_IS_DELETED = 102;
                        REQUEST_FAILED = 103;
                        INCORRECT_PERMISSIONS = 105;
// 邀请 是 shared within 空间 and 这些 permissions 是 above read access:
// whoever holds such a link 是 在 空间, and every member holds it
                        INVITE_NOT_SHAREABLE = 107;
                    }
                }
            }
        }

        message InviteGenerate {
            message Request {
                string spaceId = 1;
                model.InviteType inviteType = 2;
                model.ParticipantPermissions permissions = 3;
// shareWithinSpace stores 邀请 在 空间 itself, so ， every member 可 share it.
// 否则 邀请 是 kept 在 owner's 账户 and 仅 owner 可 share it.
                bool shareWithinSpace = 4;
            }

            message Response {
                Error error = 1;
                string inviteCid = 2;
                string inviteFileKey = 3;
                model.InviteType inviteType = 4;
                model.ParticipantPermissions permissions = 5;

                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0;
                        UNKNOWN_ERROR = 1;
                        BAD_INPUT = 2;

                        NO_SUCH_SPACE = 101;
                        SPACE_IS_DELETED = 102;
                        REQUEST_FAILED = 103;
                        LIMIT_REACHED = 104;
                        NOT_SHAREABLE = 105;
// 当前 邀请 是 already shared within 空间 and cannot 被 taken back 写入
// owner's 账户: 撤销 it and generate a 新 one
                        INVITE_ALREADY_SHARED = 106;
// an 邀请 anyone 可 join 带有 cannot 被 shared within 空间: whoever holds such a
// link 是 在, so it stays 在 owner's 账户 and 是 theirs alone 到 hand out
                        INVITE_NOT_SHAREABLE = 107;
                    }
                }
            }
        }

        message StopSharing {
            message Request {
                string spaceId = 1;
            }

            message Response {
                Error error = 1;

                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0;
                        UNKNOWN_ERROR = 1;
                        BAD_INPUT = 2;

                        NO_SUCH_SPACE = 101;
                        SPACE_IS_DELETED = 102;
                        REQUEST_FAILED = 103;
                        LIMIT_REACHED = 104;
                    }
                }
            }
        }

        message InviteGetCurrent {
            message Request {
                string spaceId = 1;
            }

            message Response {
                Error error = 1;
                string inviteCid = 2;
                string inviteFileKey = 3;
                model.InviteType inviteType = 4;
                model.ParticipantPermissions permissions = 5;
// heldByOwner 是 set when 邀请 是 kept 在 owner's 账户. Members get it 带有 an
// 空 邀请Cid and 邀请FileKey: 仅 owner 可 share link.
                bool heldByOwner = 6;

                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0;
                        UNKNOWN_ERROR = 1;
                        BAD_INPUT = 2;

                        NO_ACTIVE_INVITE = 101;
                    }
                }
            }
        }

        message InviteGetGuest {
            message Request {
                string spaceId = 1;
            }

            message Response {
                Error error = 1;
                string inviteCid = 2;
                string inviteFileKey = 3;

                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0;
                        UNKNOWN_ERROR = 1;
                        BAD_INPUT = 2;

                        INVALID_SPACE_TYPE = 101;
                    }
                }
            }
        }


        message InviteRevoke {
            message Request {
                string spaceId = 1;
            }

            message Response {
                Error error = 1;

                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0;
                        UNKNOWN_ERROR = 1;
                        BAD_INPUT = 2;

                        NO_SUCH_SPACE = 101;
                        SPACE_IS_DELETED = 102;
                        LIMIT_REACHED = 103;
                        REQUEST_FAILED = 104;
                        NOT_SHAREABLE = 105;
                    }
                }
            }
        }

        message InviteView {
            message Request {
                string inviteCid = 1;
                string inviteFileKey = 2;
            }

            message Response {
                Error error = 1;
                string spaceId = 2;
                string spaceName = 3;
                string spaceIconCid = 4;
                string creatorName = 5;
                string creatorIconCid = 10;
                uint32 spaceIconOption = 8;
                uint32 spaceUxType = 9;
                model.SpaceType spaceType = 11;
                bool   isGuestUserInvite = 6; // 已废弃, use 邀请类型
                model.InviteType inviteType = 7;

                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0;
                        UNKNOWN_ERROR = 1;
                        BAD_INPUT = 2;

                        INVITE_NOT_FOUND = 101;
                        INVITE_BAD_CONTENT = 102;
                        SPACE_IS_DELETED = 103;
                    }
                }
            }
        }

        message Join {
            message Request {
                string networkId = 1; // not-empty 仅 用于 self-hosting
                string spaceId = 2;
                string inviteCid = 3;
                string inviteFileKey = 4;
            }

            message Response {
                Error error = 1;

                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0;
                        UNKNOWN_ERROR = 1;
                        BAD_INPUT = 2;

                        NO_SUCH_SPACE = 101;
                        SPACE_IS_DELETED = 102;
                        INVITE_NOT_FOUND = 103;
                        INVITE_BAD_CONTENT = 104;
                        REQUEST_FAILED = 105;
                        LIMIT_REACHED = 106;
                        NOT_SHAREABLE = 107;
                        DIFFERENT_NETWORK = 108;
                    }
                }
            }
        }

        message JoinCancel {
            message Request {
                string spaceId = 1;
            }

            message Response {
                Error error = 1;

                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0;
                        UNKNOWN_ERROR = 1;
                        BAD_INPUT = 2;

                        NO_SUCH_SPACE = 101;
                        SPACE_IS_DELETED = 102;
                        REQUEST_FAILED = 103;
                        LIMIT_REACHED = 104;
                        NO_SUCH_REQUEST = 105;
                        NOT_SHAREABLE = 106;
                    }
                }
            }
        }

        message RequestApprove {
            message Request {
                string spaceId = 1;
                string identity = 2;
                model.ParticipantPermissions permissions = 3;
            }

            message Response {
                Error error = 1;

                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0;
                        UNKNOWN_ERROR = 1;
                        BAD_INPUT = 2;

                        NO_SUCH_SPACE = 101;
                        SPACE_IS_DELETED = 102;
                        NO_SUCH_REQUEST = 103;
                        INCORRECT_PERMISSIONS = 104;
                        REQUEST_FAILED = 105;
                        LIMIT_REACHED = 106;
                        NOT_SHAREABLE = 107;
                    }
                }
            }
        }

        message RequestDecline {
            message Request {
                string spaceId = 1;
                string identity = 2;
            }

            message Response {
                Error error = 1;

                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0;
                        UNKNOWN_ERROR = 1;
                        BAD_INPUT = 2;

                        NO_SUCH_SPACE = 101;
                        SPACE_IS_DELETED = 102;
                        REQUEST_FAILED = 103;
                        LIMIT_REACHED = 104;
                        NO_SUCH_REQUEST = 105;
                        NOT_SHAREABLE = 106;
                    }
                }
            }
        }

        message ParticipantRemove {
            message Request {
                string spaceId = 1;
                repeated string identities = 2;
            }

            message Response {
                Error error = 1;

                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0;
                        UNKNOWN_ERROR = 1;
                        BAD_INPUT = 2;

                        NO_SUCH_SPACE = 101;
                        SPACE_IS_DELETED = 102;
                        PARTICIPANT_NOT_FOUND = 103;
                        REQUEST_FAILED = 104;
                        LIMIT_REACHED = 105;
                        NOT_SHAREABLE = 106;
                    }
                }
            }
        }

        message ParticipantPermissionsChange {
            message Request {
                string spaceId = 1;
                repeated model.ParticipantPermissionChange changes = 2;
            }

            message Response {
                Error error = 1;

                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0;
                        UNKNOWN_ERROR = 1;
                        BAD_INPUT = 2;

                        NO_SUCH_SPACE = 101;
                        SPACE_IS_DELETED = 102;
                        REQUEST_FAILED = 103;
                        LIMIT_REACHED = 104;
                        PARTICIPANT_NOT_FOUND = 105;
                        INCORRECT_PERMISSIONS = 106;
                        NOT_SHAREABLE = 107;
                    }
                }
            }
        }

        message Delete {
            message Request {
                string spaceId = 1;
            }

            message Response {
                Error error = 1;
                int64 timestamp = 2;

                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0;
                        UNKNOWN_ERROR = 1;
                        BAD_INPUT = 2;

                        NO_SUCH_SPACE = 101;
                        SPACE_IS_DELETED = 102;
                        REQUEST_FAILED = 103;
                        LIMIT_REACHED = 104;
                        NOT_SHAREABLE = 105;
                    }
                }
            }
        }

        message DeleteCorruptedBackup {
            message Request {
                string backupPath = 1;
            }
            message Response {
                Error error = 1;
                message Error {
                    Code code = 1;
                    string description = 2;
                    enum Code {
                        NULL = 0;
                        UNKNOWN_ERROR = 1;
                        BAD_INPUT = 2;
                    }
                }
            }
        }

        message SetOrder {
            message Request {
                string spaceViewId = 1;
                repeated string spaceViewOrder = 2; // result order 的 空间 view ID
            }

            message Response {
                Error error = 1;
                repeated string spaceViewOrder = 2; // final order 的 空间 view ID 带有 their lexids

                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0;
                        UNKNOWN_ERROR = 1;
                        BAD_INPUT = 2;
                    }
                }
            }
        }
        message UnsetOrder {
            message Request {
                string spaceViewId = 1;
            }

            message Response {
                Error error = 1;

                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0;
                        UNKNOWN_ERROR = 1;
                        BAD_INPUT = 2;
                    }
                }
            }
        }
        message ChangeOwnership {
            message Request {
                string spaceId = 1;
                string newOwnerIdentity = 2;
                model.ParticipantPermissions oldOwnerPermissions = 3;
            }
            message Response {
                Error error = 1;

                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0;
                        UNKNOWN_ERROR = 1;
                        BAD_INPUT = 2;

                        NO_SUCH_SPACE = 101;
                        SPACE_IS_DELETED = 102;
                        REQUEST_FAILED = 103;
                        PARTICIPANT_NOT_FOUND = 105;
                        INCORRECT_PERMISSIONS = 106;
                    }
                }
            }
        }
        message ParticipantsAddList {
            message Request {
                string spaceId = 1;
                repeated string identities = 2;
                model.ParticipantPermissions permissions = 3;
            }
            message Response {
                Error error = 1;

                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0;
                        UNKNOWN_ERROR = 1;
                        BAD_INPUT = 2;

                        SEND_INVITE_FAILED = 3;

                        NO_SUCH_SPACE = 101;
                        SPACE_IS_DELETED = 102;
                        REQUEST_FAILED = 103;
                        LIMIT_REACHED = 104;
                        NOT_SHAREABLE = 105;
                        INCORRECT_PERMISSIONS = 106;
                    }
                }
            }
        }
    }

    message Wallet {
        message Create {
            /**
            * Front-end-to-middleware 请求 到 create a 新 wallet
            */
            message Request {
                string rootPath = 1; // Path 到 a wallet directory
                string fulltextPrimaryLanguage = 2; // 可选, 默认 fts language
            }

            /**
            * Middleware-to-front-end 响应, ， 可 contain mnemonic 的 a created 账户 and a NULL 错误 or an 空 mnemonic and a non-NULL 错误
            */
            message Response {
                Error error = 1;
                string mnemonic = 2; // Mnemonic 的 a 新 账户 (sequence 的 words, divided by 空间)
                string accountKey = 3;
                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0; // 无 错误; mnemonic 应当 被 non-empty
                        UNKNOWN_ERROR = 1; // 任意 other 错误
                        BAD_INPUT = 2; // Root path 是 wrong

                        FAILED_TO_CREATE_LOCAL_REPO = 101;
// 【原文】...
                    }
                }
            }
        }

        message Recover {
            /**
            * Front end 到 middleware request-to-recover-a wallet 带有 该 mnemonic and a rootPath
            */
            message Request {
                string rootPath = 1; // Path 到 a wallet directory
                string mnemonic = 2; // Mnemonic 的 a wallet 到 recover (mutually exclusive 带有 accountKey)
                string fulltextPrimaryLanguage = 3; // 可选, 默认 fts language
                string accountKey = 4; // 可选: serialized 账户 master 节点 (base64 encoded), 使用 到 auth 账户 instead 的 mnemonic
            }

            /**
            * Middleware-to-front-end 响应, ， 可 contain a NULL 错误 or a non-NULL 错误
            */
            message Response {
                Error error = 1; // 错误 while trying 到 recover a wallet
                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0; // 无 错误; wallet successfully recovered
                        UNKNOWN_ERROR = 1; // 任意 other 错误
                        BAD_INPUT = 2; // Root path or mnemonic 是 wrong

                        FAILED_TO_CREATE_LOCAL_REPO = 101;
                    }
                }
            }
        }

        message Convert {
            message Request {
                string mnemonic = 1; // Mnemonic 的 a wallet 到 convert
                string entropy = 2; // entropy 的 a wallet 到 convert

            }

            message Response {
                Error error = 1; // 错误 while trying 到 recover a wallet
                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0; // 无 错误; wallet successfully recovered
                        UNKNOWN_ERROR = 1; // 任意 other 错误
                        BAD_INPUT = 2; // mnemonic 是 wrong
                    }
                }

                string entropy = 2;
                string mnemonic = 3;
            }
        }

        message CreateSession {
            message Request {
                oneof auth {
                    string mnemonic = 1; // 【原文】cold auth
                    string appKey = 2; // persistent app 密钥, ， 可 被 使用 到 restore session. 使用 用于 Local JSON API
                    string token = 3; // token 来自 上一个 session
                    string accountKey = 4; // 私有 密钥 的 specific 账户
                }
            }

            message Response {
                Error error = 1;
                string token = 2;
                string appToken = 3; // 在 case 的 mnemonic auth, need 到 被 persisted by client
                string accountId = 4; // temp, 应当 被 replaced 带有 AccountInfo 消息
                model.Account.Auth.LocalApiScope accountScope = 5; // scope 的 session; 用于 appKey auth it 是 app link's scope
                string appName = 6; // 用于 appKey auth, app name recorded when app link 曾是 created
                int64 appExpireAt = 7; // 用于 appKey auth, app link's expiration unix 时间戳; 0 means 密钥 never expires
                model.Account.Auth.AppGrant grant = 8; // 用于 appKey auth, app link's grant; unset means an unscoped 密钥
                string appHash = 9; // 用于 appKey auth, app link's 身份 ( hash ListApps and 撤销App use)
                int64 appCreatedAt = 10; // 用于 appKey auth, app link's creation unix 时间戳; 0 means unknown (pre-hash-era link)

                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0;
                        UNKNOWN_ERROR = 1;
                        BAD_INPUT = 2;

                        APP_TOKEN_NOT_FOUND_IN_THE_CURRENT_ACCOUNT = 101; // means client logged 写入 another 账户 or 账户 directory has been cleaned
                        APP_TOKEN_EXPIRED = 102; // app link's expireAt has passed; 密钥 必须 被 re-issued
                    }
                }
            }
        }

        message CloseSession {
            message Request {
                string token = 1;
            }

            message Response {
                Error error = 1;
                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0;
                        UNKNOWN_ERROR = 1;
                        BAD_INPUT = 2;
                    }
                }
            }
        }
    }

    message Account {
        message Config {
            bool enableDataview = 1;
            bool enableDebug = 2;
            bool enablePrereleaseChannel = 3;
            bool enableSpaces = 4;

            google.protobuf.Struct extra = 100;
        }

        message Create {
            /**
            * Front end 到 middleware request-to-create-an 账户
            */
            message Request {
                string name = 1; // 账户 name
                oneof avatar {//待办: Remove 如果 不 needed, GO-1926
                    string avatarLocalPath = 2; // Path 到 an image, ， 将 被 使用 as an avatar 的 该 账户
                }
                string storePath = 3; // Path 到 local storage
                int64 icon = 4; // Option 的 pre-installed icon
                bool disableLocalNetworkSync = 5; // 【原文】Disable local network discovery
                NetworkMode networkMode = 6; // 可选, 默认 是 DefaultConfig
                string networkCustomConfigFilePath = 7; // config path 用于 custom network mode }
                bool preferYamuxTransport = 8; // 可选, 默认 是 否, recommended 在 case 的 problems 带有 QUIC transport
                string jsonApiListenAddr = 9; // 可选, 如果 空 json api 将 不 被 started; 127.0.0.1:31009 应当 被 默认 one
                string joinStreamUrl = 10; // anytype:// schema URL 到 join an embed stream
// 如果 是 - 将 run membership v2 polling loop, v2 methods 将 被 available
// 如果 否 - 将 run membership v1 polling loop, v2 methods 将 return 错误
                bool enableMembershipV2 = 11; // 可选, 默认 是 否
            }
            /**
            * Middleware-to-front-end 响应 用于 an 账户 creation 请求, ， 可 contain a NULL 错误 and created 账户 or a non-NULL 错误 and an 空 账户
            */
            message Response {
                Error error = 1; // 错误 while trying 到 create an 账户
                anytype.model.Account account = 2; // A newly created 账户; 在 case 的 a failure, i.e. 错误 是 non-NULL, 账户 model 应当 contain 空/default-value fields
                Config config = 3; // 已废弃, use 账户, GO-1926
                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0; // 无 错误; 账户 应当 被 non-empty
                        UNKNOWN_ERROR = 1; // 任意 other 错误
                        BAD_INPUT = 2; // Avatar or name 是 不 correct

                        ACCOUNT_CREATED_BUT_FAILED_TO_START_NODE = 101;
                        ACCOUNT_CREATED_BUT_FAILED_TO_SET_NAME = 102;
                        FAILED_TO_STOP_RUNNING_NODE = 104;
                        FAILED_TO_WRITE_CONFIG = 105;
                        FAILED_TO_CREATE_LOCAL_REPO = 106;
                        ACCOUNT_CREATION_IS_CANCELED = 107;
                        ANOTHER_ANYTYPE_PROCESS_IS_RUNNING = 108;

                        CONFIG_FILE_NOT_FOUND = 200;
                        CONFIG_FILE_INVALID = 201;
                        CONFIG_FILE_NETWORK_ID_MISMATCH = 202;
                    }
                }
            }
        }

        message Recover {
            /**
            * Front end 到 middleware request-to-start-search 的 an 账户 用于 a recovered mnemonic.
            * 每个 的 an 账户 ， would 被 found 将 come 带有 an AccountAdd event
            */
            message Request {
            }

            /**
            * Middleware-to-front-end 响应 到 an 账户 recover 请求, ， 可 contain a NULL 错误 and created 账户 or a non-NULL 错误 and an 空 账户
            */
            message Response {
                Error error = 1; // 错误 while trying 到 recover an 账户
                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0; // 无 错误;
                        UNKNOWN_ERROR = 1; // 任意 other 错误
                        BAD_INPUT = 2;

                        NEED_TO_RECOVER_WALLET_FIRST = 102;
                    }
                }
            }
        }

        message Delete {
            message Request {
            }

            message Response {
                Error error = 1; // 错误 while trying 到 recover an 账户
                anytype.model.Account.Status status = 2;

                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0; // 无 错误;
                        UNKNOWN_ERROR = 1; // 任意 other 错误
                        BAD_INPUT = 2;

                        ACCOUNT_IS_ALREADY_DELETED = 101;
                        UNABLE_TO_CONNECT = 102;
                    }
                }
            }
        }

        message RevertDeletion {
            message Request {
            }

            message Response {
