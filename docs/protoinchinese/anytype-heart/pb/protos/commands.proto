        message RunProfiler {
            message Request {
// 0 = save heap 快照 仅; >0 = run timed profiler (CPU, heap, goroutines) 用于 该 many seconds. Set includeTrace 到 also capture runtime execution trace.
                int32 durationInSeconds = 1;
                Reason reason = 2;
// 可选 free-form description 到 attach 到 profile
                string reasonDesc = 3;
// Also capture runtime execution trace (runtime/trace). Off by 默认: it 是 heaviest artifact 在 both archive 大小 and runtime overhead. 仅 applies when durationInSeconds > 0.
                bool includeTrace = 4;

                enum Reason {
                    UNKNOWN = 0;
// Triggered explicitly by 用户
                    USER_REQUEST = 1;
// 【原文】iOS: DISPATCH_MEMORYPRESSURE_WARN
// 【原文】Android: onTrimMemory(RUNNING_LOW)
                    MEMORY_PRESSURE_WARN = 2;
// 【原文】iOS: DISPATCH_MEMORYPRESSURE_CRITICAL / applicationDidReceiveMemoryWarning
// 【原文】Android: onTrimMemory(RUNNING_CRITICAL)
                    MEMORY_PRESSURE_CRITICAL = 3;
// 【原文】iOS: ProcessInfo.thermalState == .serious
// Android: THERMAL_状态_SEVERE
                    THERMAL_SERIOUS = 4;
// 【原文】iOS: ProcessInfo.thermalState == .critical
// Android: THERMAL_状态_CRITICAL or higher
                    THERMAL_CRITICAL = 5;
                }
            }

            message Response {
                Error error = 1;
                string path = 2;

                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0;
                        UNKNOWN_ERROR = 1;
                        BAD_INPUT = 2;
                    }
                }
            }
        }
