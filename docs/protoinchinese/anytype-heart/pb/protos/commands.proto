// one-shot cross-space search, 无 subscription overhead. Queries
// 空间 whose 对象 stores 是 loaded at moment 的 call —
// stores load sequentially 在 app start, so early calls 可 see a
// partial 空间 set; 响应 reports it via allStoresLoaded.
// Tech-space and marketplace 对象 是 excluded. 无 total 是
// returned. fullText uses detailed matching 的
// ObjectSearchWithMeta (不 ObjectSearch's name-prefix mode).
        message CrossSpaceSearch {
            message Request {
                repeated anytype.model.Block.Content.Dataview.Filter filters = 1;
// 空 sorts: fullText queries 默认 到 relevance order,
// browse queries (空 fullText) 到 lastModifiedDate desc
                repeated anytype.model.Block.Content.Dataview.Sort sorts = 2;
                string fullText = 3;
// 偏移 and 限制 apply 到 merged cross-space result.
// Always set a 限制: an unlimited 请求 materializes every
// 空间 在 full
                int32 offset = 4;
                int32 limit = 5;
// 密钥 到 return 在 记录; 空 = 所有
                repeated string keys = 6;
// 可选 allowlist applied before querying stores. 空
// means 所有 用户 空间; callers 带有 无 access 必须 不 query.
                repeated string spaceIds = 7;
            }

            message Response {
                Error error = 1;
                repeated google.protobuf.Struct records = 2;
// 否 = 记录 是 a partial view: sequential
// per-space 存储 warm-up had 不 finished when query
// ran, or a space's 存储 failed and 曾是 skipped. Retry
// later 用于 complete view, or use
// ObjectCrossSpaceSearchSubscribe, 其 streams
// later-loading 空间 as they open.
                bool allStoresLoaded = 3;

                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0;
                        UNKNOWN_ERROR = 1;
                        BAD_INPUT = 2;
// 【原文】...
                    }
                }
            }
        }

