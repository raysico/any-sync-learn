    /**
    * A Membership 是 a bundle 的 several "Features"
    * every 用户 应当 have one and 仅 one tier
    * 用户 可 不 have N tiers (无 combining)
    */
    message Membership {
        /**
        * Get 当前 状态 的 membership
        * including tier, 状态, dates, etc
        * 警告: 该 可 被 cached by Anytype heart
        */
        message GetStatus {
            message Request {
// pass 是 到 force cache update
// by 默认 该 是 否
                bool noCache = 1;
            }

            message Response {
                Error error = 1;

                anytype.model.Membership data = 2;

                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0;
                        UNKNOWN_ERROR = 1;
                        BAD_INPUT = 2;

                        NOT_LOGGED_IN = 3;
                        PAYMENT_NODE_ERROR = 4;
                        CACHE_ERROR = 5;

                        MEMBERSHIP_NOT_FOUND = 6;
                        MEMBERSHIP_WRONG_STATE = 7;
                        CAN_NOT_CONNECT = 8;
                    }
                }
            }
        }

        /**
        * Check 如果 requested name 是 valid and vacant 用于 requested tier
        * 【原文】before requesting a payment link and paying
        */
        message IsNameValid {
            message Request {
                uint32 requestedTier = 1;

                string nsName = 2;

                anytype.model.NameserviceNameType nsNameType = 3;
            }

            message Response {
                Error error = 1;

                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0;
                        UNKNOWN_ERROR = 1;
                        BAD_INPUT = 2;

                        TOO_SHORT = 3;
                        TOO_LONG = 4;
                        HAS_INVALID_CHARS = 5;
                        TIER_FEATURES_NO_NAME = 6;
// 如果 everything 是 fine - "name 是 already taken" check 应当 被 done 在 NS
// 【原文】see IsNameAvailable()
                        TIER_NOT_FOUND = 7;

                        NOT_LOGGED_IN = 8;
                        PAYMENT_NODE_ERROR = 9;
                        CACHE_ERROR = 10;
// 用于 some probable future use (如果 needed)
                        CAN_NOT_RESERVE = 11;
                        CAN_NOT_CONNECT = 12;
// 相同 as 如果 NameService.ResolveName returned ， name 是 already
// occupied by some 用户
                        NAME_IS_RESERVED = 13;
                    }
                }
            }
        }

        /**
        * Generate a unique ID 用于 payment 请求 (用于 mobile clients)
        * Generate a link 到 Stripe/Crypto where 用户 可 pay 用于 membership (用于 desktop client)
        */
        message RegisterPaymentRequest {
            message Request {
                uint32 requestedTier = 1;

                anytype.model.Membership.PaymentMethod paymentMethod = 2;

// 如果 空 - then 无 name requested
// 如果 non-empty - PP 节点 将 register ， name 在 behalf 的 用户
                string nsName = 3;

                anytype.model.NameserviceNameType nsNameType = 4;

// 用于 some tiers and payment methods (like crypto) we need an e-mail
// please get 如果 either 来自:
// 1. Membership.GetStatus() -> anytype.model.Membership.userEmail 字段
// 2. Ask 用户 来自 UI
                string userEmail = 5;
            }

            message Response {
                Error error = 1;

// 将 feature 当前 billing ID
// 【原文】stripe.com/?client_reference_id=1234
                string paymentUrl = 2;
// billingID 是 仅 needed 用于 mobile clients
                string billingId = 3;

                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0;
                        UNKNOWN_ERROR = 1;
                        BAD_INPUT = 2;

                        NOT_LOGGED_IN = 3;
                        PAYMENT_NODE_ERROR = 4;
                        CACHE_ERROR = 5;

                        TIER_NOT_FOUND = 6;
                        TIER_INVALID = 7;
                        PAYMENT_METHOD_INVALID = 8;
                        BAD_ANYNAME = 9;
                        MEMBERSHIP_ALREADY_EXISTS = 10;
                        CAN_NOT_CONNECT = 11;
// 用于 tiers and payment methods ， require ，
                        EMAIL_WRONG_FORMAT = 12;
                    }
                }
            }
        }

        /**
        * Generate a link 到 portal where 用户 可:
        * 【原文】a) change his billing details
        * 【原文】b) see payment info, invoices, etc
        * 【原文】c) cancel membership
        */
        message GetPortalLinkUrl {
            message Request {

            }

            message Response {
                Error error = 1;

                string portalUrl = 2;

                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0;
                        UNKNOWN_ERROR = 1;
                        BAD_INPUT = 2;

                        NOT_LOGGED_IN = 3;
                        PAYMENT_NODE_ERROR = 4;
                        CACHE_ERROR = 5;
                        CAN_NOT_CONNECT = 6;
                    }
                }
            }
        }

        message Finalize {
            message Request {
// 如果 空 - then 无 name requested
// 如果 non-empty - PP 节点 将 register ， name 在 behalf 的 用户
                string nsName = 1;

                anytype.model.NameserviceNameType nsNameType = 2;
            }

            message Response {
                Error error = 1;

                message Error {
                    Code code = 1;
                    string description = 2;

                    enum Code {
                        NULL = 0;
                        UNKNOWN_ERROR = 1;
                        BAD_INPUT = 2;

                        NOT_LOGGED_IN = 3;
                        PAYMENT_NODE_ERROR = 4;
                        CACHE_ERROR = 5;

                        MEMBERSHIP_NOT_FOUND = 6;
                        MEMBERSHIP_WRONG_STATE = 7;

                        BAD_ANYNAME = 8;

                        CAN_NOT_CONNECT = 9;
                    }
                }
            }
        }

        /**
        * Get 当前 状态 的 e-mail verification.
        * 状态 可 change 如果 you call GetVerificationEmail or VerifyEmailCode
        */
        message GetVerificationEmailStatus {
            message Request {
            }

            message Response {
                Error error = 1;

                anytype.model.Membership.EmailVerificationStatus status = 2;

                message Error {
                    Code code = 1;
