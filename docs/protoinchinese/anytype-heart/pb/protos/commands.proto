                    enum Code {
                        NULL = 0;
                        UNKNOWN_ERROR = 1;
                        BAD_INPUT = 2;

                        NOT_LOGGED_IN = 3;
                        PAYMENT_NODE_ERROR = 4;
                        CACHE_ERROR = 5;

                        EMAIL_WRONG_FORMAT = 6;
                        EMAIL_ALREADY_VERIFIED = 7;
                        EMAIL_ALREDY_SENT = 8;
                        EMAIL_FAILED_TO_SEND = 9;

                        MEMBERSHIP_ALREADY_EXISTS = 10;
                        CAN_NOT_CONNECT = 11;
                    }
                }
            }
        }

        /**
        * Verify e-mail address 的 用户
        * need a correct 代码 ， 曾是 sent 到 用户 when calling GetVerificationEmail
        */
        message VerifyEmailCode {
            message Request {
