        message LocalLink {
// 已废弃: pairing a gRPC session via local-link challenge
// 是 being removed; authenticate through JSON API instead.
            message NewChallenge {
                message Request {
                    string appName = 1; // just 用于 info, 不 secure 到 rely 在
                    model.Account.Auth.LocalApiScope scope = 2;
// requestedGrant (3) 是 gone: an app cannot know 空间 ID
// before pairing, so a space-listed 请求 曾是
// unimplementable by clients 字段 existed 用于.
// grant 是 USER's decision now, collected by
// 【原文】approval prompt — see ApproveChallenge.grant.
                    reserved 3;
                    reserved "requestedGrant";
// 【原文】the permission the app declares it needs. It pre-fills
// approval prompt's permission control and 是 never a
// ceiling — human approving decides. Read 是 zero
// value, so "asked 用于 read" and "asked 用于 nothing" 是
// 【原文】indistinguishable by design (both render the safe
// 默认).
                    model.Account.Auth.AppGrant.Perm requestedPerm = 4;
                }

                message Response {
                    Error error = 1;
                    string challengeId = 2;
                    message Error {
                        Code code = 1;
                        string description = 2;

                        enum Code {
                            NULL = 0;
                            UNKNOWN_ERROR = 1;
                            BAD_INPUT = 2;

                            ACCOUNT_IS_NOT_RUNNING = 101;
                            TOO_MANY_REQUESTS = 102; // protection 来自 overuse
                        }
                    }
                }
            }
            message SolveChallenge {
                message Request {
                    string challengeId = 1;
                    string answer = 2;
                }

                message Response {
                    Error error = 1;
                    string sessionToken = 2; // ephemeral token 用于 session
                    string appKey = 3;  // persistent 密钥, ， 可 被 使用 到 restore session via CreateSession
                    model.Account.Auth.AppGrant grant = 4; // user's approved grant persisted 带有 app 密钥; unset 用于 an unscoped 密钥

                    message Error {
                        Code code = 1;
                        string description = 2;

                        enum Code {
                            NULL = 0;
                            UNKNOWN_ERROR = 1;
                            BAD_INPUT = 2;

                            ACCOUNT_IS_NOT_RUNNING = 101;
                            INVALID_CHALLENGE_ID = 102;
                            CHALLENGE_ATTEMPTS_EXCEEDED = 103;
                            INCORRECT_ANSWER = 104;
// 用户 has 不 approved 该 challenge yet, so
// 无 代码 exists 到 compare against
                            CHALLENGE_NOT_APPROVED = 105;
                        }
                    }
                }
            }
// ApproveChallenge 是 user's decision 在 a pending challenge.
// It 是 仅 call ， mints 代码, and it answers
// caller rather than broadcasting, so 代码 never reaches
// 【原文】sessions other than the one that approved.
//
// pending challenge 是 addressed by caller it came 来自,
// 其 是 what prompt showed 用户. 仅 one challenge 可
// 被 pending per caller, so pair 是 unambiguous, and it 是
// durable 身份 a future "always allow" would 密钥 在.
//
// Desktop UI 仅: it 必须 never 被 listed 在 noAuthMethods or
// 【原文】limitedScopeMethods, so authorization admits full scope alone.
            message ApproveChallenge {
                message Request {
// both taken verbatim 来自 ClientInfo 的
// LinkApprovalRequest event being answered; either 可能 被 空
                    string processPath = 1;
                    string origin = 2;
                    bool allow = 3;
// user's grant decision, persisted verbatim 写入
// app link 在 solve. 必需 when allow 是 是 and
// challenge scope 是 JsonAPI, forbidden 否则 —
// BAD_INPUT either way around. Ignored when allow 是
// 否.
                    model.Account.Auth.AppGrant grant = 4;
                }

                message Response {
                    Error error = 1;
                    string challenge = 2; // 4-digit 代码; 空 when allow 是 否

                    message Error {
                        Code code = 1;
                        string description = 2;

                        enum Code {
                            NULL = 0;
                            UNKNOWN_ERROR = 1;
                            BAD_INPUT = 2;

                            ACCOUNT_IS_NOT_RUNNING = 101;
// nothing pending 用于 该 caller: never requested,
// 【原文】already decided, or expired
                            NO_PENDING_CHALLENGE = 102;
                        }
                    }
                }
            }
            message ListApps {
                message Request {
                }

                message Response {
                    Error error = 1;
                    repeated model.Account.Auth.AppInfo app = 2;

                    message Error {
                        Code code = 1;
                        string description = 2;

                        enum Code {
                            NULL = 0;
                            UNKNOWN_ERROR = 1;
                            BAD_INPUT = 2;

                            ACCOUNT_IS_NOT_RUNNING = 101;
                        }
                    }
                }
            }
            message CreateApp {
                message Request {
                    model.Account.Auth.AppInfo app = 1;
                }

                message Response {
                    Error error = 1;
                    string appKey = 2; // persistent 密钥, ， 可 被 使用 到 restore session via CreateSession or 用于 JSON API

                    message Error {
                        Code code = 1;
                        string description = 2;

                        enum Code {
                            NULL = 0;
                            UNKNOWN_ERROR = 1;
                            BAD_INPUT = 2;

                            ACCOUNT_IS_NOT_RUNNING = 101;
                        }
                    }
                }
            }
            message UpdateApp {
                message Request {
                    string appHash = 1;
                    model.Account.Auth.AppGrant grant = 2; // 新 grant; unset clears scoping (widen-requires-re-consent 是 caller's contract)
                }

                message Response {
                    Error error = 1;

                    message Error {
                        Code code = 1;
                        string description = 2;

                        enum Code {
                            NULL = 0;
                            UNKNOWN_ERROR = 1;
                            BAD_INPUT = 2;
                            NOT_FOUND = 3;

                            ACCOUNT_IS_NOT_RUNNING = 101;
                        }
                    }
                }
            }
            message RevokeApp {
                message Request {
                    string appHash = 1;
                }

                message Response {
                    Error error = 1;

                    message Error {
                        Code code = 1;
                        string description = 2;

                        enum Code {
                            NULL = 0;
                            UNKNOWN_ERROR = 1;
                            BAD_INPUT = 2;
                            NOT_FOUND = 3;

                            ACCOUNT_IS_NOT_RUNNING = 101;
                        }
                    }
                }
            }

        }

    }
