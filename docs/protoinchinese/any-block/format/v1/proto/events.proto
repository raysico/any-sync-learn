  message User {
    message Block {

      /**
       * Middleware 到 front end event 消息, ， 将 被 sent 在 该
       * scenario: Precondition: 用户 A opened a block
       * 1. 用户 B opens 相同 block
       * 2. 用户 A receives a 消息 about p.1
       */
      message Join {
        Account account = 1; // 账户 的 用户, ， opened a block
      }

      /**
       * Middleware 到 front end event 消息, ， 将 被 sent 在 该
       * scenario: Precondition: 用户 A and 用户 B opened 相同 block
       * 1. 用户 B closes block
       * 2. 用户 A receives a 消息 about p.1
       */
      message Left {
        Account account = 1; // 账户 的 用户, ， left block
      }

      /**
       * Middleware 到 front end event 消息, ， 将 被 sent 在 该
       * scenario: Precondition: 用户 A and 用户 B opened 相同 block
       * 1. 用户 B sets cursor or selects a text region 写入 a text block
       * 2. 用户 A receives a 消息 about p.1
       */
      message TextRange {
        Account account = 1; // 账户 的 用户, ， selected a text
        string blockId = 2;  // ID 的 text block, ， have a selection
        anytype.model.Range range = 3; // Range 的 selection
      }

      /**
       * Middleware 到 front end event 消息, ， 将 被 sent 在 该
       * scenario: Precondition: 用户 A and 用户 B opened 相同 block
       * 1. 用户 B selects some inner blocks
       * 2. 用户 A receives a 消息 about p.1
       */
      message SelectRange {
        Account account = 1; // 账户 的 用户, ， selected blocks
        repeated string blockIdsArray = 2; // ID 的 selected blocks.
      }
    }
  }

