syntax = "proto3";
package anytype;
option go_package = "github.com/anyproto/any-block/format/v1/pb";

import "format/v1/proto/models.proto";
import "google/protobuf/struct.proto";

/*
 * Event – 类型 的 消息, ， could 被 sent 来自 a middleware 到
 * 【原文】corresponding front-end.
 */
message Event {
  repeated Message messages = 1;
  string contextId = 2;
  anytype.model.Account initiator = 3;
  string traceId = 4;

  message Message {
    string spaceId = 132;
    oneof value {
      Account.Show accountShow = 1;
      Account.Details accountDetails = 201;
      Account.Config.Update accountConfigUpdate = 202;
      Account.Update accountUpdate = 203;
      Account.LinkApprovalRequest accountLinkApprovalRequest = 204;
      Account.LinkApprovalHide accountLinkApprovalHide = 205;
      Account.Recovery.Update accountRecoveryUpdate = 206;
      Account.JsonApiStatus accountJsonApiStatus = 207;

      Object.Details.Set objectDetailsSet = 16;
      Object.Details.Amend objectDetailsAmend = 50;
      Object.Details.Unset objectDetailsUnset = 51;
      Object.Relations.Amend objectRelationsAmend = 52;
      Object.Relations.Remove objectRelationsRemove = 53;

      Object.Remove objectRemove = 54;
      Object.Close objectClose = 65;

      Object.Restrictions.Set objectRestrictionsSet = 55;

      Object.Subscription.Add subscriptionAdd = 60;
      Object.Subscription.Remove subscriptionRemove = 61;
      Object.Subscription.Position subscriptionPosition = 62;
      Object.Subscription.Counters subscriptionCounters = 63;
      Object.Subscription.Groups subscriptionGroups = 64;

      Block.Add blockAdd = 2;
      Block.Delete blockDelete = 3;
      Block.FilesUpload filesUpload = 4;
      Block.MarksInfo marksInfo = 5;

      Block.Set.Fields blockSetFields = 6;
      Block.Set.ChildrenIds blockSetChildrenIds = 7;
      Block.Set.Restrictions blockSetRestrictions = 8;
      Block.Set.BackgroundColor blockSetBackgroundColor = 9;

      Block.Set.Text blockSetText = 10;
      Block.Set.File blockSetFile = 11;
      Block.Set.Link blockSetLink = 13;
      Block.Set.Bookmark blockSetBookmark = 14;
      Block.Set.Align blockSetAlign = 15;
      Block.Set.Div blockSetDiv = 17;
      Block.Set.Relation blockSetRelation = 21;
      Block.Set.Latex blockSetLatex = 25;
      Block.Set.VerticalAlign blockSetVerticalAlign = 36;
      Block.Set.TableRow blockSetTableRow = 37;
      Block.Set.Widget blockSetWidget = 40;

      Block.Dataview.ViewSet blockDataviewViewSet = 19;
      Block.Dataview.ViewDelete blockDataviewViewDelete = 20;
      Block.Dataview.ViewOrder blockDataviewViewOrder = 29;
      Block.Dataview.SourceSet blockDataviewSourceSet =
          35; // 已废弃, source 是 无 longer 使用
      Block.Dataview.GroupOrderUpdate blockDataViewGroupOrderUpdate = 38;
      Block.Dataview.ObjectOrderUpdate blockDataViewObjectOrderUpdate = 39;
      Block.Dataview.RelationDelete blockDataviewRelationDelete = 124;
      Block.Dataview.RelationSet blockDataviewRelationSet = 123;
      Block.Dataview.ViewUpdate blockDataviewViewUpdate = 125;
      Block.Dataview.TargetObjectIdSet blockDataviewTargetObjectIdSet = 126;
      Block.Dataview.IsCollectionSet blockDataviewIsCollectionSet = 127;

// 已废弃
      Block.Dataview.OldRelationDelete blockDataviewOldRelationDelete = 24;
// 已废弃
      Block.Dataview.OldRelationSet blockDataviewOldRelationSet = 23;

      User.Block.Join userBlockJoin = 31;
      User.Block.Left userBlockLeft = 32;
      User.Block.SelectRange userBlockSelectRange = 33;
      User.Block.TextRange userBlockTextRange = 34;

      Ping ping = 100;

      Process.New processNew = 101;
      Process.Update processUpdate = 102;
      Process.Done processDone = 103;

      Status.Thread threadStatus = 110;

      File.LimitReached fileLimitReached = 111;
      File.SpaceUsage fileSpaceUsage = 112;
      File.LocalUsage fileLocalUsage = 113;
      File.LimitUpdated fileLimitUpdated = 118;

      Notification.Send notificationSend = 114;
      Notification.Update notificationUpdate = 115;

      Payload.Broadcast payloadBroadcast = 116;

      Membership.Update membershipUpdate = 117;
      Membership.TiersUpdate membershipTiersUpdate = 137;

      Space.SyncStatus.Update spaceSyncStatusUpdate = 119;

      P2PStatus.Update p2pStatusUpdate = 120;

      Import.Finish importFinish = 121;

      Chat.Add chatAdd = 128;
      Chat.Update chatUpdate = 129;
      Chat.UpdateReactions chatUpdateReactions = 130;
      Chat.UpdateMessageReadStatus chatUpdateMessageReadStatus =
          134; // received 到 update per-message read 状态 (如果 needed 到
// highlight unread messages 在 UI)
      Chat.UpdateMentionReadStatus chatUpdateMentionReadStatus =
          135; // received 到 update per-message mention read 状态 (如果 needed
// 到 highlight unread mentions 在 UI)
      Chat.UpdateMessageSyncStatus chatUpdateMessageSyncStatus = 136;
      Chat.UpdatePinnedStatus chatUpdatePinnedStatus = 140;
      Chat.UpdateReactionReadStatus chatUpdateReactionReadStatus = 141;
      Object.AutoArchive objectAutoArchive = 142;
      Object.AutoRestore objectAutoRestore = 143;
      Object.CleanupSuggestion objectCleanupSuggestion = 146;
      Debug.ProfileCreated debugProfileCreated = 145;
      Chat.UpdateMessageCount chatUpdateMessageCount =
          144; // received whenever total number 的 non-deleted messages 在
// 【原文】the chat changes

      Chat.Delete chatDelete = 131;
      Chat.UpdateState chatStateUpdate =
          133; // 在 case 新 unread messages received or chat state changed
// (e.g. 消息 read 在 another device)

      MembershipV2.Update membershipV2Update = 138;
      MembershipV2.ProductsUpdate membershipV2ProductsUpdate = 139;

      Import.Statistic importStatistic = 147;
      Pubsub.Message pubsubMessage = 148;
    }
  }

  message Pubsub {
// 消息 是 one decrypted, signature-verified pub/sub 消息 received 在
// 【原文】a topic matching at least one active Rpc.Pubsub.Subscribe subscription.
// 空间 是 carried by Event.消息.spaceId. Delivery 是 ephemeral,
// at-most-once: messages published while 不 subscribed 是 never seen.
    message Message {
// topic 是 concrete '/'-separated topic 消息 曾是 published 到
      string topic = 1;
// 载荷 是 application 载荷, decrypted 带有 空间 read 密钥
      bytes payload = 2;
// 身份 是 signature-verified 账户 ID 的 sender; a client
// also receives 其 own published messages back (local echo)
      string identity = 3;
// subIds 是 local subscription ID whose pattern matched topic
      repeated string subIds = 4;
    }
  }

  message Chat {
    message Add {
      string id = 1;
      string orderId = 2;
      string afterOrderId = 6;
      model.ChatMessage message = 3;
      repeated string subIds = 4;
      repeated google.protobuf.Struct dependencies = 5;
    }
    message Delete {
      string id = 1;
      repeated string subIds = 2;
    }
    message Update {
      string id = 1;
      model.ChatMessage message = 2;
      repeated string subIds = 3;
    }
    message UpdateReactions {
      string id = 1;
      model.ChatMessage.Reactions reactions = 2;
      repeated string subIds = 3;
    }

    message UpdateMessageReadStatus {
      repeated string ids = 1;
      bool isRead = 2;
      repeated string subIds = 3;
    }
    message UpdateMentionReadStatus {
      repeated string ids = 1;
      bool isRead = 2;
      repeated string subIds = 3;
    }
    message UpdateMessageSyncStatus {
      repeated string ids = 1;
      bool isSynced = 2;
      repeated string subIds = 3;
    }

    message UpdateState {
      model.ChatState state = 1;
      repeated string subIds = 2;
    }
    message UpdatePinnedStatus {
      model.ChatMessage message = 1;
      bool isPinned = 2;
      repeated string subIds = 3;
    }
    message UpdateReactionReadStatus {
      repeated string ids = 1;
      bool isUnread = 2;
      repeated string subIds = 3;
    }
    message UpdateMessageCount {
      int32 messageCount = 1; // total number 的 non-deleted messages (includes replies)
      repeated string subIds = 2;
    }
  }

  message Account {
    /**
     * 消息, ， 将 被 sent 到 front 在 每个 账户 found after an
     * 【原文】AccountRecoverRequest
     */
    message Show {
      int32 index = 1; // Number 的 an 账户 在 an 所有 found 账户 列表
      anytype.model.Account account =
          2; // An 账户, ， has been found 用于 mnemonic
    }

    message Details {
      string profileId = 1;
      google.protobuf.Struct details = 2;
    }

    message Config {
      message Update {
        anytype.model.Account.Config config = 1;
        anytype.model.Account.Status status = 2;
      }
    }

    message Update {
      anytype.model.Account.Config config = 1;
      anytype.model.Account.Status status = 2;
    }

// LinkApprovalRequest asks 用户 到 approve a local-link pairing. It
// names who 是 asking and nothing else: 4-digit 代码 does 不 exist
// yet and 是 never broadcast. user's answer goes back through
// AccountLocalLinkApproveChallenge, 其 mints 代码 and returns it 到
// ， one caller. Replaces former LinkChallenge event, 其 carried
// 代码 到 every session.
    message LinkApprovalRequest {
      message ClientInfo {
        string processName = 1;
        string processPath = 2;
        string name = 4;
        bool signatureVerified = 3;
// origin 的 browser caller ， asked 用于 challenge, e.g.
// "chrome-extension://<ID>" or "http://localhost:3000". 空 用于
// native clients, 其 send 无 Origin 头部. Taken 来自 头部
// browser sets, never 来自 请求 body, so it names
// caller even when `name` 是 任意. Show it 到 用户: it 是
// 仅 attributable part 的 a pairing 请求.
        string origin = 5;
      }
// 1 曾是 `string challenge`, 4-digit 代码 该 event 使用 到
// broadcast. Reserved, 不 merely deleted: oneof number 204 是 reused,
// so a desktop ， predates rename decodes 该 消息 带有
// 旧 LinkChallenge descriptor. Today it reads an 空 代码; a future
// 字段 1 的 任意 string 类型 would 被 rendered 到 用户 AS 代码
// 到 类型. rename exists precisely so 无 client 可 read a 代码 off
// 该 event — leaving 1 reusable would undo it.
      reserved 1;
      reserved "challenge";
      ClientInfo clientInfo = 2;
      model.Account.Auth.LocalApiScope scope = 3;
// requestedGrant (4) 是 gone — grant 是 user's decision now,
// 【原文】collected by the approval prompt (ApproveChallenge.grant).
      reserved 4;
      reserved "requestedGrant";
// permission app claims 到 need; pre-fills prompt's
// 【原文】permission control. Untrusted like `name`, and never a ceiling — the
// human approving decides. Read 是 zero value, so a read claim 是
// indistinguishable 来自 无 claim (both render safe 默认).
      model.Account.Auth.AppGrant.Perm requestedPerm = 5;
    }

// LinkApprovalHide takes a pending prompt off screen once it 是 answered,
// denied or expired. Identified by caller, since a 请求 ， 曾是
// never approved never had a 代码.
    message LinkApprovalHide {
// 1 曾是 `string challenge`; see LinkApprovalRequest. 相同 reuse 的
// oneof number (205), 相同 trap.
      reserved 1;
      reserved "challenge";
      LinkApprovalRequest.ClientInfo clientInfo = 2;
    }

// Recovery 是 账户 start-up 状态 stream (GO-7471): a
// recovery-scoped, monotonic event log covering every app open, 来自
// 第一个 millisecond 的 AccountSelect until every 空间 has published 其
// load result. Rpc.账户.RecoveryState serves folded 快照 来自
// 相同 state, so push and pull cannot drift. Clients apply Updates
// 带有 相同 runId and ID == 最后一个+1; 在 a gap or a 新 runId they
// re-pull 快照. Every 载荷 是 a level, never a delta.
    message Recovery {
// ModeUnknown 是 zero value and 是 never emitted: an unset 字段
// 必须 不 read as a cold recovery, worse failure direction.
      enum Mode {
        ModeUnknown = 0;
        ColdRecovery = 1; // fresh device: 账户 repo did 不 exist
        WarmStart = 2;    // 【原文】the repo existed
        NewAccount = 3;   // 账户 creation paths
      }
// 不 monotone: phase 是 derived 来自 run's 当前 condition
// and moves back when ， condition regresses (losing 最后一个 节点
// 【原文】connection mid-fetch goes FetchingAccount -> Connecting; the
// WaitingForNetwork overlay returns 到 phase it interrupted).
// Clients 必须 render phase 最后一个 received rather than dropping
// backward transitions. 仅 Done and Failed 是 terminal.
// Phases 可能 被 skipped (a warm start never enters FetchingAccount);
// clients 必须 accept 任意 forward jump.
      enum Phase {
        LookingForPeers = 0;
        Connecting = 1;
        FetchingAccount = 2;
        LoadingSpaces = 3;
        Done = 4;
        WaitingForNetwork = 5; // calm, auto-retrying resting state; 不 an 错误 screen
        Failed = 6;            // 【原文】account-level fatal; AccountSelect itself failed
// NotStarted 是 idle snapshot's phase: 无 recovery run has begun
// 在 该 process (快照.runId 是 空). A 新 number 在 purpose:
// 【原文】the zero value would read as LookingForPeers before anything happens.
        NotStarted = 7;
      }
      enum ErrorClass {
        None = 0;
        NoNetwork = 1;
        PeerUnreachable = 2;
        IncompatibleVersion = 3;
        NotAuthorized = 4;
        SpaceDeleted = 5;
        AccountDeleted = 6;
        AccountNotFound = 7;
        RateLimited = 8;
        StorageLimit = 9; // reserved, 无 producer yet
        Unexpected = 10;
      }
      enum PeerKind {
        LocalPeer = 0;
        NetworkNode = 1;
      }
      enum Direction {
        Outbound = 0;
        Inbound = 1;
      }
      enum SpaceKind {
        Regular = 0;
        Tech = 1;
      }
// Loaded = 空间 controller published LocalStatusOk: mandatory
// 对象 fetched, 树 sync started. Object-level progress after ，
// 是 在 Event.空间.SyncStatus.Update.
      enum SpaceState {
        Queued = 0;
        Pulling = 1;
        Loading = 2;
        Loaded = 3;
        Error = 4;
// Removed: 空间 left 该 run (deleted or removed while
// recovering); drop it 来自 列表, it 是 excluded 来自 counters
        Removed = 5;
// Stalled: run settled around 该 空间 but it never published a
// load result. 不 terminal — load 可能 still complete, and
// state 将 change again 如果 it does — so Finished does 不 fire while
// a 空间 是 stalled. Render it as a determinate stall 带有 a retry
// ("79 的 80 loaded, 1 stalled"), never as ongoing progress.
        Stalled = 6;
      }
      enum DiscoveryState {
        Possible = 0;
        NoInterfaces = 1;
        Restricted = 2;
      }
// LocalPeersState 是 fold's headline 用于 LAN layer, derived 来自
// 【原文】every LocalPeer's dial state and space-exchange answer. The negative
// verdict surfaces 仅 once every connected LAN peer has answered and
// none holds 账户; one positive answer flips it at once.
      enum LocalPeersState {
        NoLocalPeers = 0;
        LocalPeersConnecting = 1;   // 【原文】discovered, dialing, or connected and awaiting the exchange
        LocalPeersUnreachable = 2;  // every discovered peer failed 到 connect
        AccountNotOnLocalPeers = 3; // every connected peer answered: it does 不 hold 账户
        AccountOnLocalPeer = 4;     // at least one peer holds account's tech 空间
      }

// ErrorInfo (不 "错误": enum values and nested messages share
// enclosing scope, and SpaceState.错误 already takes ， name)
      message ErrorInfo {
        ErrorClass class = 1;
        bool retryable = 2;
// raw 错误 text 用于 logs/diagnostics; clients 可能 log it, 必须 never
// 【原文】headline it
        string debugMessage = 3;
      }

      message Update {
        string runId = 1;      // random per run; a change means "新 run, reset"
        int64 id = 2;          // 【原文】monotonic within runId, starts at 1; gap => re-pull
        int64 timestampMs = 3; // 【原文】unix ms
        oneof payload {
          Started started = 10;
          PhaseChanged phaseChanged = 11;
          LocalDiscoveryState localDiscoveryState = 12;
          PeerDiscovered peerDiscovered = 13;
          DialStarted dialStarted = 14;
          PeerConnected peerConnected = 15;
          DialFailed dialFailed = 16;
          PeerDisconnected peerDisconnected = 17;
          AccountFetchStarted accountFetchStarted = 18;
          AccountFetchError accountFetchError = 19;
          AccountReady accountReady = 20;
          SpaceDiscovered spaceDiscovered = 21;
          SpaceStateChanged spaceStateChanged = 22;
          Finished finished = 23;
// sent 仅 到 a newly attached session: snapshot-on-subscribe
          Snapshot snapshot = 24;
          PeerSpaceExchange peerSpaceExchange = 25;
          LocalPeersStateChanged localPeersStateChanged = 26;
        }
      }

      message Started {
        Mode mode = 1;
        string networkId = 2;
      }
      message PhaseChanged {
        Phase phase = 1;
        Phase fromPhase = 2;
        int64 previousPhaseDurationMs = 3;
        ErrorInfo error = 4; // set 用于 WaitingForNetwork and Failed
      }
      message LocalDiscoveryState { DiscoveryState state = 1; }
      message PeerDiscovered {
        string peerId = 1;
        repeated string addrs = 2; // display 仅
        PeerKind kind = 3;
        repeated string nodeTypes = 4;
      }
      message DialStarted {
        string peerId = 1;
        PeerKind kind = 2;
        repeated string nodeTypes = 3; // nodeconf 节点 类型, e.g. coordinator, 树, 文件
        int32 addrsCount = 4;
      }
      message PeerConnected {
        string peerId = 1;
        PeerKind kind = 2;
        repeated string nodeTypes = 3;
        Direction direction = 4;
        string addr = 5;      // display 仅; never compare across directions
        string transport = 6; // 【原文】scheme as any-sync reports it: quic, yamux, ...
        uint32 protoVersion = 7;
        int64 durationMs = 8; // 【原文】0 = unknown (inbound)
        int32 openConnections = 9;
      }
      message DialFailed {
        string peerId = 1;
        PeerKind kind = 2;
        repeated string nodeTypes = 3;
        ErrorInfo error = 4;
        int32 attempt = 5; // dials observed since 最后一个 Connected
        int64 durationMs = 6;
      }
      message PeerDisconnected {
        string peerId = 1;
        PeerKind kind = 2;
        int32 openConnections = 3;
        repeated string nodeTypes = 4;
      }
// PeerSpaceExchange reports what 空间 exchange 带有 a LAN peer
// said — a fact, 不 a verdict: whether peer holds 该 account's
// tech 空间 and how many 空间 it shares. exchanged=否 means 无
// answer 是 known ( peer 曾是 dropped 来自 peer 存储).
      message PeerSpaceExchange {
        string peerId = 1;
        bool exchanged = 2;
        bool hasAccountSpace = 3;
        int32 sharedSpaceCount = 4;
      }
      message LocalPeersStateChanged {
        LocalPeersState state = 1;
        LocalPeersState fromState = 2;
      }
      message AccountFetchStarted {
        string spaceId = 1;
        string peerId = 2; // 空 = waiting 用于 a peer
        int32 attempt = 3; // pull rounds started; a 新 round means "still trying"
      }
      message AccountFetchError {
        string peerId = 1;
        ErrorInfo error = 2;
        int32 attempt = 3;
      }
      message AccountReady { int64 durationMs = 1; } // since Started; UI 可能 start
      message SpaceDiscovered {
        string spaceId = 1;
        string spaceViewId = 2;
        SpaceKind kind = 3;
      }
      message SpaceStateChanged {
        string spaceId = 1;
        SpaceState state = 2;
        SpaceState fromState = 3;
        ErrorInfo error = 4;
        int32 attempt = 5; // 【原文】pull attempts, a level
      }
      message Finished {
        int32 spacesTotal = 1;
        int32 spacesLoaded = 2;
        int32 spacesFailed = 3;
        int64 totalDurationMs = 4;
// 是: SpaceView set 曾是 confirmed against network ("无 more
// 空间 到 download"); 否: completeness gate opened 在 其
// stall bound and 无 completeness claim 可能 被 made — keep relying 在
// SpaceView subscription 用于 空间 ， appear later
        bool viewsConfirmed = 5;
      }

// Folded state. Served by Rpc.账户.RecoveryState and pushed once 到
// 每个 新 session. RPC 是 total: before 任意 run it returns
// idle 快照 (runId 空, phase NotStarted) rather than an 错误.
      message Snapshot {
        string runId = 1; // 空: 无 run has begun, ignore rest
        int64 lastEventId = 2;
        Mode mode = 3;
        string networkId = 4;
        int64 startedAtMs = 5;
        Phase phase = 6;
        int64 phaseStartedAtMs = 7;
        bool done = 8;
        ErrorInfo error = 9; // account-level 仅
        DiscoveryState discovery = 10;
        bool accountFetchStarted = 11;
        bool accountReady = 12;
        repeated Peer peers = 13;
        repeated Space spaces = 14;
        int32 spacesTotal = 15;
        int32 spacesLoaded = 16;
        int32 spacesFailed = 17;
        bool viewsConfirmed = 18; // 【原文】meaningful once done; see Finished
        int32 accountFetchAttempt = 19;
        ErrorInfo accountFetchError = 20; // 最后一个 failed pull; cleared at AccountReady
        LocalPeersState localPeers = 21;
        message Peer {
          string peerId = 1;
          PeerKind kind = 2;
          repeated string nodeTypes = 3;
          int32 openConnections = 4;
          string transport = 5;
          uint32 protoVersion = 6;
          int32 dialAttempts = 7;
          ErrorInfo lastError = 8;
          bool discoveredLocally = 9;
          bool exchanged = 10; // a 空间 exchange answered; two fields below apply
          bool hasAccountSpace = 11;
          int32 sharedSpaceCount = 12;
        }
        message Space {
          string spaceId = 1;
          string spaceViewId = 2;
          SpaceKind kind = 3;
          SpaceState state = 4;
          ErrorInfo error = 5;
          int32 attempt = 6;
        }
      }
    }

// JsonApiStatus reports outcome 的 one bind attempt 用于 local
// 【原文】JSON API server (core/api). Broadcast after the initial bind at
// 【原文】AccountSelect/AccountCreate and after every AccountChangeJsonApiAddr,
// whichever session triggered it. 不 emitted when server 是
// disabled (an 空 listen address). AccountChangeJsonApiAddr's
// 响应 carries 该 exact 相同 消息 as `状态`, so event
// and RPC 响应 是 never two schemas 到 keep 在 sync.
    message JsonApiStatus {
      bool success = 1;
// effective, OS-confirmed bound address 在 success;
// requested address 在 failure, since nothing bound
      string listenAddr = 2;
// raw OS 错误 text — debug/log 仅, never shown 到 用户
// verbatim; 空 when success = 是
      string error = 3;
    }
  }

  message Object {
    message Details {
// Amend (i.e. add a 新 key-value pair or update an existing key-value
// 【原文】pair) existing state
      message Amend {
        message KeyValue {
          string key = 1;
          google.protobuf.Value value = 2; // 应当 不 被 null
        }
        string id = 1;                 // 【原文】context objectId
        repeated KeyValue details = 2; // slice 的 changed key-values
        repeated string subIds = 3;
      }

// Overwrite 当前 state
      message Set {
        string id = 1; // 【原文】context objectId
        google.protobuf.Struct details =
            2; // 可 不 被 a partial state. 应当 replace client details
// 【原文】state
        repeated string subIds = 3;
      }

// Unset existing detail 密钥
      message Unset {
        string id = 1; // 【原文】context objectId
        repeated string keys = 2;
        repeated string subIds = 3;
      }
    }

    message Subscription {

// Adds 新 文档 到 subscriptions
      message Add {
        string id = 1;      // 对象 ID
        string afterId = 2; // ID 的 上一个 doc 在 order, 空 means 第一个
        string subId = 3;   // 【原文】subscription id
      }

// Removes 文档 来自 subscription
      message Remove {
        string id = 1;    // 对象 ID
        string subId = 2; // 【原文】subscription id
      }

// Indicates 新 position 的 文档
      message Position {
        string id = 1;      // 对象 ID
        string afterId = 2; // ID 的 上一个 doc 在 order, 空 means 第一个
        string subId = 3;   // 【原文】subscription id
      }

      message Counters {
// total available 记录
        int64 total = 1;
// how many 记录 available after
        int64 nextCount = 2;
// how many 记录 available before
        int64 prevCount = 3;

        string subId = 4; // 【原文】subscription id
      }

      message Groups {
        string subId = 1;
        anytype.model.Block.Content.Dataview.Group group = 2;
        bool remove = 3;
      }
    }

    message Relations {

      message Amend {
        string id = 1; // 【原文】context objectId
        repeated anytype.model.RelationLink relationLinks = 2;
      }

      message Remove {
        string id = 1; // 【原文】context objectId
        repeated string relationKeys = 2;
      }
    }

    message Remove {
// notifies ， 对象 曾是 removed
