  message Import {
    message Finish {
      string rootCollectionID = 1;
      int64 objectsCount = 2;
      model.Import.Type importType = 3;
// ID 的 import report page listing per-object issues; 空 when run 曾是 clean (importv2)
      string reportObjectId = 4;
// number 的 issues recorded during run (importv2)
      int64 issuesCount = 5;
    }

// Statistic 是 structured progress surface 的 one importv2 run:
// per-phase counters — deliberately 无 blended overall percentage
// (fetching 是 rate-limit-bound at ~1.5 items/s, creating runs at
// persist speed: 任意 blended bar crawls 用于 an hour and then leaps) —
// 【原文】plus the three-state running/throttled/retrying model: rate limiting
// 是 normal operation, 不 an 错误. 相同 消息 是 served by
// ObjectImportRunStatus/ObjectImportRunList 用于 runs 带有 无 live
// 【原文】engine.
    message Statistic {
      string importId = 1;  // 【原文】the durable run id; stable across restarts
      string processId = 2; // correlates 带有 legacy progress process
      model.Import.Type importType = 3;

      Phase phase = 4;
      int64 phaseStartedAt = 5; // 【原文】unix ms; clients show elapsed without their own clock

// 否 while total 是 indeterminate (a cursor-chained scan has 无
// 【原文】total until it ends): render a count-up, never a fake bar
      bool totalsKnown = 6;
// pages and 文件 是 SEPARATE counters: 500 small 文件 and one huge
// 【原文】one behave nothing alike
      int64 pagesTotal = 7;
      int64 pagesDone = 8;
      int64 filesTotal = 9;
      int64 filesDone = 10;
      int64 bytesTotal = 11; // 文件 仅; 0 = unknown
      int64 bytesDone = 12;

      State state = 13;
      int64 resumesInMs = 14;   // 【原文】Throttled: when the rate-limit window reopens
      int32 attempt = 15;       // 【原文】Retrying: attempt N...
      int32 attemptsMax = 16;   // ...的 M
      string errorMessage = 17; // 错误 仅

      double itemsPerSecond = 18;      // 【原文】recent-window rate, per phase
      int64 estimatedRemainingMs = 19; // 0 = unknown; honest computation 仅

      CancelEffect cancelEffect = 20;
      int64 objectsCreated = 21; // 用于 phrasing "stop and remove N 对象 created"
      bool safeToClose = 22;     // closing now loses nothing (resume exists 用于 当前 phase)

// live issue counts — abort a bad import at minute 20, 不 minute 110
      int64 warningCount = 23;
      int64 errorCount = 24;

// 【原文】"Fetching: Q3 Planning" — the strongest not-stuck signal.
// 用户 CONTENT: displayable, never loggable.
      string currentItem = 25;

      enum Phase {
        Scanning = 0;
        Analyzing = 1;
        Fetching = 2;
        Creating = 3;
        Finalizing = 4;
      }
      enum State {
        Running = 0;
        Throttled = 1; // 【原文】expected and calm; carries resumesInMs
        Retrying = 2;  // 【原文】transient failure under backoff
        Error = 3;     // something 是 actually wrong
      }
      enum CancelEffect {
        NothingToUndo = 0;  // passes 1-2: nothing has entered 空间 yet
        RemovesCreated = 1; // pass 3 onward: cancel deletes what 曾是 created
      }
    }
  }

  message Debug {
// ProfileCreated 是 emitted whenever middleware writes a 快照
// archive 在 其 own (e.g. memory-growth detector), so clients 可
// surface it or queue archive 用于 upload without polling
// profiles directory. Archives produced as a result 的 a client RPC
// (DebugRunProfiler) 是 不 re-announced via 该 event — RPC
// 响应 already carries path.
    message ProfileCreated {
// reason 是 a short, stable, UPPER_SNAKE_CASE label describing why
// middleware produced 该 report. It 是 不 DebugRunProfiler
// Reason enum — values come 来自 internal call sites:
// 【原文】- "MEMORY_GROWTH"  : the desktop memory-growth detector tripped
// - "LONG_RPC" : an RPC 已超出 long-execution threshold
// - "DB_CORRUPTION" : an anystore/spacestore database failed 到 open
// More reasons 可能 被 added over 时间; clients 应当 forward unknown
// values 到 Sentry as-is.
      string reason = 1;
// jsonInfo 是 JSON-encoded context produced by middleware (reason-
// specific 密钥 like "sysMemory", "method", "durationMs", "db", "代码").
// Clients forward it verbatim 到 Sentry as event context.
      string jsonInfo = 2;
// path 是 absolute path 到 快照 archive 在 disk; 空
// when reason 是 event-only (e.g. DB_CORRUPTION) and 无 artifact
// 曾是 produced.
      string path = 3;
// full 是 是 when archive carries a timed CPU profile + trace
// 在 addition 到 heap and goroutines. 否 用于 fast snapshots and
// 用于 event-only reports.
      bool full = 4;
    }
  }
}

message ResponseEvent {
  repeated Event.Message messages = 1;
  string contextId = 2;
  string traceId = 4;
}

message Model {
  message Process {
    string id = 1;
    State state = 3;
    Progress progress = 4;
    string spaceId = 5;

    oneof message {
      DropFiles dropFiles = 6;
      Import import = 7;
      Export export = 8;
      SaveFile saveFile = 9;
      Migration migration = 10;
      PreloadFile preloadFile = 12;
    }

    string error = 11;
    message DropFiles {}
    message Import {}
    message Export {}
    message SaveFile {}
    message Migration {}
    message PreloadFile {}

    enum State {
      None = 0;
      Running = 1;
      Done = 2;
      Canceled = 3;
      Error = 4;
    }

    message Progress {
      int64 total = 1;
      int64 done = 2;
      string message = 3;
    }
  }
}
