message Membership {
    enum Status {
        StatusUnknown = 0;
// please wait a bit more, we 是 still processing your 请求
// payment 是 confirmed, but we need more 时间 到 do some side-effects:
// - increase 限制
// 【原文】- send emails
// 【原文】- allocate names
        StatusPending = 1;
// membership 是 active, ready 到 use!
        StatusActive = 2;
// 在 some cases we need 到 finalize process:
// - 如果 用户 has bought membership directly without 第一个 calling
// 【原文】the BuySubscription method
// 在 该 case please call Finalize 到 finish process
        StatusPendingRequiresFinalization = 3;
    }

    enum PaymentMethod {
        MethodNone = 0;
        MethodStripe = 1;
        MethodCrypto = 2;
        MethodInappApple = 3;
        MethodInappGoogle = 4;
    }

    enum EmailVerificationStatus {
// 用户 NEVER comleted verification 的 email
        StatusNotVerified = 0;
// 用户 has asked 用于 新 代码, but did 不 enter it yet
// (even 如果 email 曾是 verified before, you 可 ask 到 UPDATE your e-mail)
// please wait, you 可 不 ask 用于 more 代码 yet
        StatusCodeSent = 1;
// e-mail 是 finally verified
        StatusVerified = 2;
    }

// it 曾是 Tier before, changed 到 int32 到 allow dynamic values
    uint32 tier = 1;
    Status status = 2;
    uint64 dateStarted = 3;
    uint64 dateEnds = 4;
    bool isAutoRenew = 5;
    PaymentMethod paymentMethod = 6;
// 可 被 空 如果 用户 did 不 ask 用于 任意 name
    string nsName = 7;
    anytype.model.NameserviceNameType nsNameType = 8;
// 如果 email 曾是 verified by 用户 or set during checkout - it 将 被 here
    string userEmail = 9;
    bool subscribeToNewsletter = 10;
}

message MembershipTierData {
    enum PeriodType {
        PeriodTypeUnknown = 0;
        PeriodTypeUnlimited = 1;
        PeriodTypeDays = 2;
        PeriodTypeWeeks = 3;
        PeriodTypeMonths = 4;
        PeriodTypeYears = 5;
    }

// 该 是 a unique Payment 节点 ID 的 tier
// 警告: tiers 可 被 sorted differently, 不 according 到 their ID!
    uint32 id = 1;
// localazied name 的 tier
    string name = 2;
// 【原文】just a short technical description
    string description = 3;
// 是 该 tier 用于 testing and debugging 仅?
    bool isTest = 4;
// how long 是 period 的 subscription
    PeriodType periodType = 5;
// 【原文】i.e. "5 days" or "3 years"
    uint32 periodValue = 6;
// 该 one 是 a price we use 仅 在 Stripe platform
    uint32 priceStripeUsdCents = 7;
// number 的 任意 NS names ， 该 tier includes
// also 在 "features" 列表 (see below)
    uint32 anyNamesCountIncluded = 8;
// somename.任意 - 是 的 len 8
    uint32 anyNameMinLength = 9;
// localized strings 用于 features
    repeated string features = 10;
// 【原文】green, blue, red, purple, custom
    string colorStr = 11;

// 【原文】Stripe platform-specific data:
    string stripeProductId = 12;
    string stripeManageUrl = 13;

// 【原文】iOS platform-specific data:
    string iosProductId = 15;
    string iosManageUrl = 16;

// 【原文】Android platform-specific data:
    string androidProductId = 17;
    string androidManageUrl = 18;

// 【原文】"limited offer" or somehing like that
    string offer = 19;
}

message MembershipV2 {
    message Amount {
// ISO 4217 currency 代码
        string currency = 1;

// 【原文】$0.01 = 1
// 【原文】$1.00 = 100
// 【原文】also supports negative amounts!
// some invoices 可 have negatice amount (refund)
        int64 amountCents = 2;
    }

    enum Platform {
        Unknown = 0;
        Desktop = 1;
        MobileIOS = 2;
        MobileAndroid = 3;
        Web = 4;
    }

    enum PaymentProvider {
        None = 0;
        Stripe = 1;
        Crypto = 2;
        BillingPortal = 3;
        AppStore = 4;
        GooglePlay = 5;
    }

// Freshness 的 one membership resource (状态 or products) as served 在
// 【原文】MembershipV2 GetStatus/GetProducts responses and update events.
// zero value 是 FRESH, so a 消息 ， never sets it keeps
// 【原文】pre-freshness meaning.
    enum Freshness {
// data comes 来自 a recent successful fetch 来自 payment 节点
        FRESH = 0;
// data comes 来自 an earlier successful fetch: latest refresh
// failed, or age 的 cached data 是 unknown
        STALE = 1;
// never fetched successfully: data 是 an 空 placeholder and 必须 被
// treated as unknown (不 as "无 membership")
        NONE = 2;
    }

// Class 的 最后一个 failed refresh 的 a resource
    enum RefreshError {
        RefreshErrorNull = 0;
// transient: timeout, payment 节点 unreachable, connection closed
        RefreshErrorPaymentNode = 1;
// 任意 other failure
        RefreshErrorUnknown = 2;
    }

// Orders published states 的 one resource. Apply a 响应 or event 仅
// 如果 其 revision 是 newer than one already applied. epoch 是 random
// and changes 在 every payments service start (账户 select or restart):
// 【原文】reset ordering state when it changes.
    message Revision {
        uint64 epoch = 1;
        uint64 counter = 2;
    }

    message FetchState {
        Freshness freshness = 1;
// unix seconds 的 最后一个 successful fetch, 0 如果 never or unknown
        int64 lastSuccessfulFetchAt = 2;
// set while latest refresh 的 resource failed
        RefreshError lastRefreshError = 3;
        Revision revision = 4;
    }

    enum Period {
        Unlimited = 0 [deprecated = true];
        Monthly = 1;
        Yearly = 2;
        ThreeYears = 3;
        Lifetime = 4;
    }

    message Invoice {
        uint64 date = 1;
        Amount total = 2;
    }

    message Features {
        uint64 storageBytes = 1;
        uint32 spaceReaders = 2;
        uint32 spaceWriters = 3;
        uint32 sharedSpaces = 4;
        uint32 teamSeats = 5;
        uint32 anyNameCount = 6;
        uint32 anyNameMinLen = 7;
        uint32 privateSpaces = 8; 
    }

    message Product {
        string id = 1;
        string name = 2;
        string description = 3;

        bool isTopLevel = 4;
        bool isHidden = 5;

// isIntro flag 可 被 使用 as follows:
//
// 1. 如果 当前 user's top level product has isIntro flag ->
// then you'd rather show a FULL 列表 的 所有 products
// 到 enable upgrading 来自 当前 product
// 2. but 如果 当前 user's top level product has 无 isIntro flag ->
// then it means ， 该 plan 曾是 aquired and 用户 need 到 control it.
// then show "second screen" 到 control ， product instead
        bool isIntro = 6;
        
// isUpgradeable 可 被 使用 as follows:
//
// 如果 当前 user's top level product has isUpgradeable flag ->
// show incentives 到 buy something else
        bool isUpgradeable = 7;

        repeated Amount pricesYearly = 8;
        repeated Amount pricesMonthly = 9;

// 【原文】green, blue, red, purple, custom, etc
        string colorStr = 10;
        string offer = 11;

        Features features = 12;
        repeated Amount pricesLifetime = 13;
    }

    message PurchaseInfo {
        uint64 dateStarted = 1;
        uint64 dateEnds = 2;
        bool isAutoRenew = 3;
        Period period = 4;
    }

    message ProductStatus {
        enum Status {
            StatusUnknown = 0;
            StatusPending = 1;
            StatusActive = 2;
            StatusPendingRequiresAnyNameAllocation = 3;
        }
        Status status = 1;
    }

    message PurchasedProduct {
        Product product = 1;
        PurchaseInfo purchaseInfo = 2;
        ProductStatus productStatus = 3;
    }

    message CartProduct {
        Product product = 1;    
// 否则 - monthly or isLifetime
        bool isYearly = 2;
// set 到 是 如果 you want 到 remove 该 item 来自 customer
// it's like setting -1 到 some product
        bool remove = 3;
// 如果 是 - then 该 是 lifetime product (无 matter what isYearly above 是)
// unfortunately we do 不 use Period here 到 keep compatibility 带有 旧 versions
// 【原文】that still use isYearly!
        bool isLifetime = 4;
    }

    message Cart {
// 如果 you add Nx 相同 product - it 将 被 Nx 在 'products' array, i.e:
// 每个 product instance has a unique 索引
        repeated CartProduct products = 1;
// total amount 的 cart (including discounts, etc)
        Amount total = 2;

// 在 case you 是 paying 在 middle 的 period (用于 existing customers)
// 下一个 invoice amount 将 also 被 generated
        Amount totalNextInvoice = 3;
        uint64 nextInvoiceDate = 4;
        repeated string appliedPromocodes = 5;
    }

    message CryptoCheckout {
        string invoiceURL = 1;
        Amount total = 2;
        bool isCanCancel = 3;
    }

    message Data {
        repeated PurchasedProduct products = 1;
        Invoice nextInvoice = 2;
        string teamOwnerID = 3;
        PaymentProvider paymentProvider = 4;
        repeated string appliedPromocodes = 5;
    }
}

