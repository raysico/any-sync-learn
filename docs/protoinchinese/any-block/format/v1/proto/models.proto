// ============================================================
// 源文件：src/format/v1/proto/models.proto
// 所属仓库：any-block
// proto 包：anytype.model
// 服务：（无 service，仅 message 定义）
// RPC 数量：0
// 说明：由 scripts/translate-proto.py 生成；字段名、编号、类型保持原样，注释译为中文。
// ============================================================

syntax = "proto3";
package anytype.model;
option go_package = "github.com/anyproto/any-block/format/v1/model";

import "google/protobuf/struct.proto";
import "format/v1/proto/export_report.proto";

message SmartBlockSnapshotBase {
    repeated Block blocks = 1;
    google.protobuf.Struct details = 2;
    google.protobuf.Struct fileKeys = 3 [deprecated=true];
    repeated Relation extraRelations = 4 [deprecated=true];
    repeated string objectTypes = 5;
    google.protobuf.Struct collections = 6;
    repeated string removedCollectionKeys = 8;
    repeated RelationLink relationLinks = 7;
    string key = 9; // 仅 使用 用于 pb backup purposes, ignored 在 other cases
    int64 originalCreatedTimestamp = 10; // ignored 在 import/export 在 favor 的 createdDate relation. 使用 到 存储 original user-side 对象 creation 时间戳
    FileInfo fileInfo = 11;
}

enum SmartBlockType {
    AccountOld = 0; // 已废弃

    Page = 0x10;
    ProfilePage = 0x11;
    Home = 0x20;
    Archive = 0x30;
    Widget = 0x70;

    File = 0x100;

    Template = 0x120;
    BundledTemplate = 0x121;

    BundledRelation = 0x200; // 已废弃
    SubObject = 0x201;
    BundledObjectType = 0x202;    // 已废弃
    AnytypeProfile = 0x203;
    Date = 0x204;
    Workspace = 0x206;
    STRelation = 0x209;
    STType = 0x210;
    STRelationOption = 0x211;
    SpaceView = 0x212;

    Identity = 0x214;
    Participant = 0x216;
    MissingObject = 0x207;

    FileObject = 0x215;

    NotificationObject = 0x217;
    DevicesObject = 0x218;
    ChatObjectDeprecated = 0x219; // 已废弃 Container 用于 any-store based chats
    ChatDerivedObject = 0x220; // Any-store based 对象 用于 chat
    AccountObject = 0x221; // Container 用于 账户 data 在 tech 空间
    DiscussionObject = 0x222; // Any-store based 对象 用于 discussion
    TechSpaceObject = 0x223; // Any-store based 对象 在 tech 空间 用于 cross-device sync
    TechSpaceVirtualObject = 0x224; // Per-space virtual 对象 backed by a tech 空间 CRDT 文档
}

message Search {
    message Result {
        string objectId = 1;
        google.protobuf.Struct details = 2; //

        repeated Meta meta = 3; // 【原文】meta information about the search result
    }

    message Meta {
        string highlight = 1; // truncated text 带有 highlights
        repeated Range highlightRanges = 2; // ranges 的 highlight 在 text (using utf-16 runes)
        string blockId = 3; // 【原文】block id where the highlight has been found
        string relationKey = 4; // relation 密钥 的 block where highlight has been found
        google.protobuf.Struct relationDetails = 5; // contains details 用于 dependent 对象. E.g. relation option or 类型. 待办: rename 到 dependantDetails
    }

    message Message {
        message Sort {
            Key key = 1;
            Type type = 2;

            enum Key {
                ORDER_ID = 0;
                SCORE = 1;
                CREATED_AT = 2;
                MODIFIED_AT = 3;
            }

            enum Type {
                Asc = 0;
                Desc = 1;
            }
        }

        message Result {
            string chatId = 1;
            string messageId = 2;
            int64 score = 3;
            string highlight = 4; // truncated text 带有 highlights
            repeated Range highlightRanges = 5; // ranges 的 highlight 在 text (using utf-16 runes)
            ChatMessage message = 6;
            string spaceId = 7; // 空间 chat belongs 到; set 在 所有 search scopes
        }
    }

}

message Block {
    string id = 1;
    google.protobuf.Struct fields = 2;
    Restrictions restrictions = 3;
    repeated string childrenIds = 4;
    string backgroundColor = 5;
    Align align = 6;
    VerticalAlign verticalAlign = 7;

    oneof content {
        Content.Smartblock smartblock = 11;

        Content.Text text = 14;
        Content.File file = 15;
        Content.Layout layout = 16;
        Content.Div div = 17;
        Content.Bookmark bookmark = 18;
        Content.Icon icon = 19;
        Content.Link link = 20;
        Content.Dataview dataview = 21;
        Content.Relation relation = 22;
        Content.FeaturedRelations featuredRelations = 23;
        Content.Latex latex = 24;
        Content.TableOfContents tableOfContents = 25;
        Content.Table table = 26;
        Content.TableColumn tableColumn = 27;
        Content.TableRow tableRow = 28;
        Content.Widget widget = 29;
        Content.Chat chat = 30;
    }

    message Restrictions {
        bool read = 1;
        bool edit = 2;
        bool remove = 3;
        bool drag = 4;
        bool dropOn = 5;
    }

    enum Position {
        None = 0;
// 【原文】above target block
        Top = 1;
// 【原文】under target block
        Bottom = 2;
// 到 left 的 target block
        Left = 3;
// 到 right 的 target block
        Right = 4;
// inside target block, as 最后一个 block
        Inner = 5;
// 【原文】replace target block
        Replace = 6;
// inside target block, as 第一个 block
        InnerFirst = 7;
    }

    enum Align {
        AlignLeft = 0;
        AlignCenter = 1;
        AlignRight = 2;
        AlignJustify = 3;
    }

    enum VerticalAlign {
        VerticalAlignTop = 0;
        VerticalAlignMiddle = 1;
        VerticalAlignBottom = 2;
    }

    message Content {
        /*
        * Layout have 无 visual representation, but affects 在 blocks, ， it contains.
        * Row/Column layout blocks creates 仅 automatically, after some 的 a D&D operations, 用于 example
        */
        message Layout {
            Style style = 1;

            enum Style {
                Row = 0;
                Column = 1;
                Div = 2;
                Header = 3;
                TableRows = 4;
                TableColumns = 5;
            }
        }

        /*
        * Link: block 到 link some content 来自 an external sources.
        */
        message Link {
            string targetBlockId = 1; // ID 的 target block
            Style style = 2; // 已废弃
            google.protobuf.Struct fields = 3;
            IconSize iconSize = 4;
            CardStyle cardStyle = 5;
            Description description = 6;
            repeated string relations = 7;

            enum IconSize {
                SizeNone = 0;
                SizeSmall = 1;
                SizeMedium = 2;
            }

            enum Style {
                Page = 0;
                Dataview = 1;
                Dashboard = 2;
                Archive = 3;
// 【原文】...
            }

            enum Description {
                None = 0;
                Added = 1;
                Content = 2;
            }

            enum CardStyle {
                Text = 0;
                Card = 1;
                Inline = 2;
            }
        }

        /*
        * Divider: block, ， contains 仅 one horizontal thin line
        */
        message Div {
            Style style = 1;

            enum Style {
                Line = 0;
                Dots = 1;
            }
        }

        /*
        * Bookmark 是 到 keep a web-link and 到 preview a content.
        */
        message Bookmark {
            string url = 1;
// 已废弃. Get 该 data 来自 target 对象.
            string title = 2;
// 已废弃. Get 该 data 来自 target 对象.
            string description = 3;
// 已废弃. Get 该 data 来自 target 对象.
            string imageHash = 4;
// 已废弃. Get 该 data 来自 target 对象.
            string faviconHash = 5;

            LinkPreview.Type type = 6;
            string targetObjectId = 7;

            State state = 8;

            enum State {
                Empty = 0;
                Fetching = 1;
                Done = 2;
                Error = 3;
            }
        }

        message Icon {
            string name = 1;
        }

        message FeaturedRelations {
        }

        message Text {
            string text = 1;
            Style style = 2;
            Marks marks = 3; // 列表 的 marks 到 apply 到 text
            bool checked = 4;
            string color = 5;
            string iconEmoji = 6; // 使用 带有 style Callout
            string iconImage = 7; // 在 case both image and emoji 是 set, image 应当 has a priority 在 UI

            message Marks {
                repeated Mark marks = 1;
            }

            message Mark {
                Range range = 1; // range 的 symbols 到 apply 该 mark. 来自(symbol) 到(symbol)
                Type type = 2;
                string param = 3; // 【原文】link, color, etc

                enum Type {
                    Strikethrough = 0;
                    Keyboard = 1;
                    Italic = 2;
                    Bold = 3;
                    Underscored = 4;
                    Link = 5;
                    TextColor = 6;
                    BackgroundColor = 7;
                    Mention = 8;
                    Emoji = 9;
                    Object = 10;
                }
            }

            enum Style {
                Paragraph = 0;
                Header1 = 1;
                Header2 = 2;
                Header3 = 3;
                Header4 = 4; // 已废弃
                Quote = 5;
                Code = 6;
                Title = 7; // currently 仅 one block 的 该 style 可 exists 在 a page
                Checkbox = 8;
                Marked = 9;
                Numbered = 10;
                Toggle = 11;
                Description = 12; // currently 仅 one block 的 该 style 可 exists 在 a page
                Callout = 13;
                ToggleHeader1 = 14;
                ToggleHeader2 = 15;
                ToggleHeader3 = 16;
            }
        }

        message File {
            string hash = 1;
            string name = 2;
            Type type = 3;
            string mime = 4;
            int64 size = 5;
            int64 addedAt = 6;
            string targetObjectId = 9;

            State state = 7;
            Style style = 8;

            enum Type {
                None = 0;
                File = 1;
                Image = 2;
                Video = 3;
                Audio = 4;
                PDF = 5;
            }

            enum Style {
                Auto = 0; // 所有 类型 expect 文件 and None has Embed style by 默认
                Link = 1;
                Embed = 2;
            }

            enum State {
                Empty = 0; // There 是 无 文件 and preview, it's an 空 block, ， waits 文件.
                Uploading = 1; // There 是 still 无 文件/preview, but 文件 already uploading
                Done = 2; // 文件 and preview downloaded
                Error = 3; // 错误 while uploading
            }
        }

        message Smartblock {
        }

        message Dataview {
            repeated string source = 1; // 可 被 set 用于 detached(without TargetObjectId) inline sets
            repeated View views = 2;
            string activeView = 3; // do 不 generate changes 用于 该 字段
// 已废弃
            repeated model.Relation relations = 4;
            repeated GroupOrder groupOrders = 12;
            repeated ObjectOrder objectOrders = 13;
            repeated anytype.model.RelationLink relationLinks = 5;
            string TargetObjectId = 6; // 空 用于 original set/collection 对象 and 用于 detached inline sets
            bool isCollection = 14;

            message View {
                string id = 1;
                Type type = 2;
                string name = 3;
                repeated Sort sorts = 4;
                repeated Filter filters = 5;
                repeated Relation relations = 6; // relations fields/columns options, also 使用 到 provide order
                string coverRelationKey = 7; // Relation 使用 用于 cover 在 gallery
                bool hideIcon = 8; // 【原文】Hide icon near name
                Size cardSize = 9; // Gallery card 大小
                bool coverFit = 10; // 【原文】Image fits container
                string groupRelationKey = 11; // Group view by 该 relationKey
                bool groupBackgroundColors = 12; // Enable backgrounds 在 groups
                int32 pageLimit = 13; // 限制 的 对象 shown 在 widget
                string defaultTemplateId = 14; // 默认 template ， 是 chosen 用于 新 对象 created within view
                string defaultObjectTypeId = 15; // 默认 对象 类型 ， 是 chosen 用于 新 对象 created within view
                string endRelationKey = 16; // Group view by 该 relationKey
                bool wrapContent = 17; // Wrap content 在 view
                ListSize listSize = 18; // 列表 view 大小 setting
                bool alternateRows = 19; // Alternate row background colors 在 grid view

                enum Type {
                    Table = 0;
                    List = 1;
                    Gallery = 2;
                    Kanban = 3;
                    Calendar = 4;
                    Graph = 5;
                }

                enum Size {
                    Small = 0;
                    Medium = 1;
                    Large = 2;
                }

                enum ListSize {
                    Compact = 0;  // Single-line display (默认)
                    Regular = 1;  // Two-line display 带有 description
                }
            }

            message Relation {
                string key = 1;
                bool isVisible = 2;
                int32 width = 3; // displayed column % calculated based 在 other visible relations
// bool isReadOnly = 4; // 已废弃
                bool dateIncludeTime = 5; // 已废弃
                TimeFormat timeFormat = 6; // 已废弃
                DateFormat dateFormat = 7; // 已废弃
                FormulaType formula = 8;
                Block.Align align = 9;

                enum DateFormat {
                    MonthAbbrBeforeDay = 0; // 【原文】Jul 30, 2020
                    MonthAbbrAfterDay = 1; // 【原文】30 Jul 2020
                    Short = 2; // 【原文】30/07/2020
                    ShortUS = 3; // 【原文】07/30/2020
                    ISO = 4; // 【原文】2020-07-30
                }

                enum TimeFormat {
                    Format12 = 0;
                    Format24 = 1;
                }

                enum FormulaType {
                    None				    = 0;
                    Count				    = 1;
                    CountValue      = 2;
                    CountDistinct		= 3;
                    CountEmpty			= 4;
                    CountNotEmpty		= 5;
                    PercentEmpty		= 6;
                    PercentNotEmpty	= 7;
                    MathSum				  = 8;
                    MathAverage			= 9;
                    MathMedian			= 10;
                    MathMin				  = 11;
                    MathMax				  = 12;
                    Range				    = 13;
                }
            }

            message Sort {
                string RelationKey = 1;
                Type type = 2;
                repeated google.protobuf.Value customOrder = 3;
                RelationFormat format = 4;
                bool includeTime = 5;
                string id = 6;
                EmptyType emptyPlacement = 7;
                bool noCollate = 8;

                enum Type {
                    Asc = 0;
                    Desc = 1;
                    Custom = 2;
                }

                enum EmptyType {
                    NotSpecified = 0;
                    Start = 1;
                    End = 2;
                }
            }

            message Filter {
                string id = 9;
                Operator operator = 1; // looks 不 applicable?
                string RelationKey = 2;
                string relationProperty = 5;
                Condition condition = 3;
                google.protobuf.Value value = 4;
                QuickOption quickOption = 6;
                RelationFormat format = 7;
                bool includeTime = 8;
                repeated Filter nestedFilters = 10;

                enum Operator {
                    No = 0;
                    Or = 1;
                    And = 2;
                }

                enum Condition {
                    None = 0;
                    Equal = 1;
                    NotEqual = 2;
                    Greater = 3;
                    Less = 4;
                    GreaterOrEqual = 5;
                    LessOrEqual = 6;
                    Like = 7;
                    NotLike = 8;
                    In = 9; // "at least one value(来自 provided 列表) 是 在"
                    NotIn = 10; // "none 的 provided values 是 在"
                    Empty = 11;
                    NotEmpty = 12;
                    AllIn = 13;
                    NotAllIn = 14;
                    ExactIn = 15;
                    NotExactIn = 16;
                    Exists = 17;
                }

                enum QuickOption {
                    ExactDate = 0;
                    Yesterday = 1;
                    Today = 2;
                    Tomorrow = 3;
                    LastWeek = 4;
                    CurrentWeek = 5;
                    NextWeek = 6;
                    LastMonth = 7;
                    CurrentMonth = 8;
                    NextMonth = 9;
                    NumberOfDaysAgo = 10;
                    NumberOfDaysNow = 11;
                    LastYear = 12;
                    CurrentYear = 13;
                    NextYear = 14;
                }
            }

            message GroupOrder {
                string viewId = 1;
                repeated ViewGroup viewGroups = 2;
            }

            message ViewGroup {
                string groupId = 1;
                int32 index = 2;
                bool hidden = 3;
                string backgroundColor = 4;
            }

            message ObjectOrder {
                string viewId = 1;
                string groupId = 2;
                repeated string objectIds = 3;
            }

            message Group {
                string id = 1;
                oneof Value {
                    Status status = 2;
                    Tag tag = 3;
                    Checkbox checkbox = 4;
                    Date date = 5;
                }
            }

            message Status {
                string id = 1;
            }

            message Tag {
                repeated string ids = 1;
            }

            message Checkbox {
                bool checked = 1;
            }

            message Date {
            }
        }

        message Relation {
            string key = 1;
        }

        message Latex {
            string text = 1;
            Processor processor = 2;

            enum Processor {
                Latex = 0;
                Mermaid = 1;
                Chart = 2;
                Youtube = 3;
                Vimeo = 4;
                Soundcloud = 5;
                GoogleMaps = 6;
                Miro = 7;
                Figma = 8;
                Twitter = 9;
                OpenStreetMap = 10;
                Reddit = 11;
                Facebook = 12;
                Instagram = 13;
                Telegram = 14;
                GithubGist = 15;
                Codepen = 16;
                Bilibili = 17;
                Excalidraw = 18;
                Kroki = 19;
                Graphviz = 20;
                Sketchfab = 21;
                Image = 22;
                Drawio = 23;
                Spotify = 24;
            }
        }

        message TableOfContents {
        }

        message Table {}
        message TableColumn {}
        message TableRow {
            bool isHeader = 1;
        }

        message Widget {
            Layout layout = 1;
            int32 limit = 2;
            string viewId = 3;
            bool autoAdded = 4;

            enum Layout {
                Link = 0;
                Tree = 1;
                List = 2;
                CompactList = 3;
                View = 4;
            }
        }
        message Chat {

        }
    }
}

/*
* 使用 到 decode block meta 仅, without content itself
*/
message BlockMetaOnly {
    string id = 1;
    google.protobuf.Struct fields = 2;
}

/*
* General purpose structure, uses 在 Mark.
*/
message Range {
    int32 from = 1;
    int32 to = 2;
}

/**
* Contains basic information about a 用户 账户
*/
message Account {
    string id = 1; // 【原文】User's thread id
    Config config = 4;
    Status status = 5;
    Info info = 6;

    message Config {
        bool enableDataview = 1;
        bool enableDebug = 2;
        bool enablePrereleaseChannel = 3;
        bool enableSpaces = 4;

        google.protobuf.Struct extra = 100;
    }

    message Status {
        StatusType statusType = 1;
        int64 deletionDate = 2;
    }

    enum StatusType {
        Active = 0;
        PendingDeletion = 1;
        StartedDeletion = 2;
        Deleted = 3;
    }

    message Info {
        string homeObjectId = 2; // 【原文】home dashboard block id
        string archiveObjectId = 3; // 【原文】archive block id
        string profileObjectId = 4; // 【原文】profile block id
        string marketplaceWorkspaceId = 11; // 【原文】marketplace workspace id
        string workspaceObjectId = 15; // workspace 对象 ID. 使用 用于 space-level chat
        string spaceChatId = 16; // space-level chat 如果 exists

        string deviceId = 8;
        string accountSpaceId = 9; // 第一个 created 私有 空间. It's filled 仅 when 账户 是 created
        string widgetsId = 10;
        string spaceViewId = 13;
        string techSpaceId = 14;

        string gatewayUrl = 101; // gateway url 用于 fetching static 文件
        string localStoragePath = 103; // path 到 local storage
        string timeZone = 104; // 时间 zone 来自 config
        string analyticsId = 105;
        string networkId = 106; // network ID 到 其 anytype 是 connected
        string ethereumAddress = 107; // we have 任意 PK AND Ethereum PK derived 来自 one 随机种子（使根变更唯一） phrase
        string metaDataKey = 108; // symmetric 密钥 用于 encrypting profile metadata
    }

    message Auth {
        message AppInfo {
            string appHash = 1;
            string appName = 2; // either 来自 process or specified manually when creating
            string appKey = 4;
            int64 createdAt = 5;
            int64 expireAt = 6; // unix 时间戳 在 seconds after 其 密钥 stops authenticating; 0 means 密钥 never expires
            LocalApiScope scope = 7;
            bool isActive = 8;
            AppGrant grant = 9; // unset means an unscoped (legacy) 密钥; 仅 JsonAPI-scope 密钥 可能 carry one
        }
        enum LocalApiScope {
            Limited = 0; // 使用 在 WebClipper; AccountSelect(到 被 已废弃), ObjectSearch, ObjectShow, ObjectCreate, ObjectCreateFromURL, BlockPreview, BlockPaste, BroadcastPayloadEvent
            JsonAPI = 1; // JSON API 仅, 无 direct grpc api calls allowed
            Full = 2; // Full access, 不 available via LocalLink
        }
        message AppGrant {
// spaceIds 是 空间 密钥 可能 touch; 空 仅 when
// allSpaces 是 set — exactly one 的 two 必须 被 present
            repeated string spaceIds = 1;
            Perm perm = 2;
// allSpaces grants every 空间 在 账户, including 空间
// created after grant 曾是 made (dynamic — GitHub's "所有
// 【原文】repositories" semantics). The JSON API still excludes the tech
// 空间; reaching it requires listing it explicitly 在 spaceIds.
            bool allSpaces = 3;
// Perm 是 nested so 其 Go constants (AccountAuthAppGrant_Read) 可
// never 被 misread as 密钥 scopes (AccountAuth_JsonAPI et al.) —
// grant verbs and 密钥 scopes 是 unrelated enums about different
// 【原文】authorization layers.
            enum Perm {
                Read = 0; // zero value 是 narrowest permission, so an unset perm never widens
                ReadWrite = 1;
            }
        }
    }

}

message LinkPreview {
    string url = 1;
    string title = 2;
    string description = 3;
    string imageUrl = 4;
    string faviconUrl = 5;
    Type type = 6;

    enum Type {
        Unknown = 0;
        Page = 1;
        Image = 2;
        Text = 3;
    }
}

message Restrictions {
    repeated ObjectRestriction object = 1;
    repeated DataviewRestrictions dataview = 2;

    enum ObjectRestriction {
        None = 0;
// 【原文】restricts delete
        Delete = 1;
// restricts work 带有 relations
        Relations = 2;
// restricts work 带有 blocks
        Blocks = 3;
// restricts work 带有 details
        Details = 4;
// restricts 类型 changing
        TypeChange = 5;
// 【原文】restricts layout changing
        LayoutChange = 6;
// restricts template creation 来自 该 对象
        Template = 7;
// restricts duplicate 对象
        Duplicate = 8;
// 可 被 set 仅 用于 类型. Restricts creating 对象 的 该 类型
        CreateObjectOfThisType = 9;
// 对象 是 不 allowed 到 publish
        Publish = 10;
    }


    message DataviewRestrictions {
        string blockId = 1;
        repeated DataviewRestriction restrictions = 2;
    }

    enum DataviewRestriction {
        DVNone = 0;
        DVRelation = 1;
        DVCreateObject = 2;
        DVViews = 3;
    }
}

message Object {
    message ChangePayload {
        SmartBlockType smartBlockType = 1;
        string key = 2;
        bytes data = 3;
    }
}

message SpaceObjectHeader {
    string spaceID = 1;
}

message ObjectType {
    string url = 1; // leave 空 在 case you want 到 create 新 one
    string name = 2; // name 的 objectType 在 singular form (可 被 localized 用于 bundled 类型)
    repeated RelationLink relationLinks = 3; // cannot contain more than one Relation 带有 相同 RelationType
    Layout layout = 4;
    string iconEmoji = 5; // 【原文】emoji symbol
    string description = 6;
    bool hidden = 7;
    bool readonly = 10;
    repeated SmartBlockType types = 8;
    bool isArchived = 9; // sets locally 到 hide 对象 类型 来自 set and some other places
    bool installedByDefault = 11;
    string key = 12; // name 的 objectType (可 被 localized 用于 bundled 类型)
    int64 revision = 13; // revision 的 system objectType. 使用 到 check 如果 we 应当 change 类型 content or 不
    bool restrictObjectCreation = 14; // restricts creating 对象 的 该 类型 用于 用户
    int64 iconColor = 15; // color 的 对象 类型 icon
    string iconName = 16; // name 的 对象 类型 icon
    string pluralName = 17; // name 的 objectType 在 plural form (可 被 localized 用于 bundled 类型)

    enum Layout {
        basic = 0;
        profile = 1;
        todo = 2;
        set = 3;
        objectType = 4;
        relation = 5;
        file = 6;
        dashboard = 7;
        image = 8;
        note = 9;
        space = 10;
        bookmark = 11;
        relationOptionsList = 12;
        relationOption = 13;
        collection = 14;
        audio = 15;
        video = 16;
        date = 17;
        spaceView = 18;
        participant = 19;

        pdf = 20;
        chatDeprecated = 21; // 已废弃
        chatDerived = 22;
        tag = 23;

        notification = 24;
        missingObject = 25;
        devices = 26;
        discussion = 27;
    }
}

message Layout {
    ObjectType.Layout id = 1;
    string name = 2;
    repeated Relation requiredRelations = 3; // relations 必需 用于 该 对象 类型
}

message RelationWithValue {
    Relation relation = 1;
    google.protobuf.Value value = 2;
}

// Relation describe human-interpreted relation 类型. It 可能 被 something like "Date 的 creation, format=date" or "Assignee, format=objectId, objectType=person"
message Relation {
    string id = 100;

// 密钥 under 其 value 是 stored 在 map. 必须 被 unique 用于 对象 类型.
// It usually auto-generated bsonid, but also 可能 被 something human-readable 在 case 的 prebuilt 类型.
    string key = 1;

    RelationFormat format = 2; // format 的 underlying data
    string name = 3; // name 到 show (可 被 localized 用于 bundled 类型)
    google.protobuf.Value defaultValue = 4;
    DataSource dataSource = 5; // where data 是 stored

    bool hidden = 6; // internal, 不 displayed 到 用户 (e.g. coverX, coverY)
    bool readOnly = 7; // value 不 editable by 用户 tobe renamed 到 readonlyValue
    bool readOnlyRelation = 15; // relation metadata, eg name and format 是 不 editable by 用户

    bool multi = 8; // allow multiple values (stored 在 pb 列表)

    repeated string objectTypes = 9; // URL 的 对象 类型, 空 到 allow link 到 任意 对象
// 索引 10, 11 曾是 使用 在 internal-only builds. 可 被 reused, but 可能 break some test 账户
    repeated Option selectDict = 12; // 默认 dictionary 带有 unique values 到 choose 用于 select/multiSelect format
    int32 maxCount = 13; // max number 的 values 可 被 set 用于 该 relation. 0 means 无 限制. 1 means value 可 被 stored 在 non-repeated 字段
    string description = 14;

// on-store fields, injected 仅 locally
    Scope scope = 20; // 已废弃, 到 被 removed
    string creator = 21; // 【原文】creator profile id
    int64 revision = 22; // revision 的 system relation. 使用 到 check 如果 we 应当 change relation content or 不
    bool includeTime = 23; // indicates whether value 的 relation 带有 date format 应当 被 processed 带有 seconds precision

    message Option {
        string id = 1; // ID generated automatically 如果 omitted
        string text = 2;
        string color = 3; // 【原文】stored
// 4 是 reserved 用于 旧 relation format
        string relationKey = 5; // 【原文】stored
        string orderId = 6; // lexicographic ID 的 relation option 用于 ordering
    }

    enum Scope {
        object = 0; // stored within 对象
        type = 1; // stored within 对象 类型
        setOfTheSameType = 2; // aggregated 来自 dataview 的 sets 的 相同 对象 类型
        objectsOfTheSameType = 3; // aggregated 来自 dataview 的 sets 的 相同 对象 类型
        library = 4; // aggregated 来自 relations library
    }

    enum DataSource {
        details = 0; // 默认, stored inside object's details
        derived = 1; // stored locally, e.g. 在 badger or generated 在 fly
        account = 2; // stored 在 账户 DB. means existing 仅 用于 specific anytype 账户
        local = 3; // 【原文】stored locally
    }
}

// RelationFormat describes how underlying data 是 stored 在 google.protobuf.Value and how it 应当 被 validated/sanitized
enum RelationFormat {
    longtext = 0; // 【原文】string
    shorttext = 1; // string, usually short enough. 可能 被 truncated 在 future
    number = 2; // 【原文】double
    status = 3; // string or 列表 的 string(len==1)
    tag = 11; // 列表 的 string (choose multiple 来自 a 列表)
    date = 4; // 【原文】float64(pb.Value doesn't have int64) or the string
    file = 5; // relation 可 has 对象 的 specific 类型: 文件, image, audio, video
    checkbox = 6; // 【原文】boolean
    url = 7; // string 带有 sanity check
    email = 8; // string 带有 sanity check
    phone = 9; // string 带有 sanity check
    emoji = 10; // one emoji, 可 contains multiple utf-8 symbols

    object = 100; // relation 可 has objectType 到 specify objectType
    relations = 101; // 【原文】base64-encoded relation pb model
    map = 102; // relation ， handle map 的 values
}

