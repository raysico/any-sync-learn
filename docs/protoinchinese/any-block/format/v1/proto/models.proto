        string oldestOrderId = 1; // oldest(在 lex sorting) unread 消息 order ID. Client 应当 ALWAYS scroll through unread messages 来自 oldest 到 newest
        int32 counter = 2; // total number 的 unread messages
    }
    UnreadState messages = 1; // 【原文】unread messages
    UnreadState mentions = 2; // 【原文】unread mentions
    string lastStateId = 3; // reflects state 的 chat db at moment 的 sending 响应/event ， includes 该 state
    int64 order = 4; // Order 是 serial number 的 该 state. Client 应当 apply chat state 仅 如果 其 order 是 greater than previously saved order
    string unreadReactionOrderId = 5; // order ID 的 newest 消息 带有 任意 unread reactions
}

message ChatMessage {
    string id = 1;        // Unique 消息 identifier
    string orderId = 2;   // Lexicographical ID 用于 消息 在 order 的 树 traversal
    string creator = 3;       // Identifier 用于 消息 creator
    int64 createdAt = 4;
    int64 modifiedAt = 9;

// stateId 是 ever-increasing ID (BSON ObjectId) 用于 该 消息. Unlike orderId, 该 ID 是 ordered by 时间 messages 是 added. 用于 example, it's useful 到 prevent accidental reading 的 messages 来自 past when a ChatReadMessages 请求 是 sent: a 消息 来自 past 可能 appear, but client 是 still unaware 的 it
    string stateId = 11;

    string replyToMessageId = 5;   // Identifier 用于 消息 being replied 到
    MessageContent message = 6;  // 消息 content
    repeated Attachment attachments = 7;  // 【原文】Attachments slice
    Reactions reactions = 8;  // Reactions 到 消息
    bool read = 10; // 消息 read 状态
    bool mentionRead = 12;
    bool hasMention = 14;
    bool synced = 13;
    bool pinned = 15;
    bool unreadReaction = 16;
    repeated MessageBlock blocks = 17;  // Ordered 列表 的 content blocks
// 【原文】deleted marks a soft-deleted discussion comment (a tombstone). It keeps id, orderId,
// creator, createdAt and replyToMessageId, so replies keep their thread; 消息,
// attachments, blocks and reactions 是 空 and modifiedAt 是 0. 仅 discussions
// produce it; a deleted space-chat 消息 是 removed and announced 带有 Event.Chat.Delete.
// A tombstone can't 被 edited, reacted 到, pinned or replied 到.
    bool deleted = 18;

    message MessageContent {
        string text = 1;      // text content 的 消息 part
        Block.Content.Text.Style style = 2;    // style/类型 的 消息 part
        repeated Block.Content.Text.Mark marks = 3; // 列表 的 marks applied 到 text
    }

    message Attachment {
        string target = 1;       // Identifier 用于 attachment 对象
        AttachmentType type = 2; // 类型 的 attachment

        enum AttachmentType {
            FILE = 0;   // 文件 attachment
            IMAGE = 1;  // 【原文】Image attachment
            LINK = 2;   // 【原文】Link attachment
        }
    }

    message Reactions {
        map<string, IdentityList> reactions = 1; // Map 的 emoji 到 列表 的 用户 ID

        message IdentityList {
            repeated string ids = 1; // 列表 的 用户 ID
        }
    }

    message MessageBlock {
        oneof content {
            MessageBlockText text = 1;
            MessageBlockLink link = 2;
            MessageBlockEmbed embed = 3;
            MessageBlockEditorQuote editorQuote = 4;
            MessageBlockMessageQuote messageQuote = 5;
        }
    }

    message MessageBlockText {
        string text = 1;
        Block.Content.Text.Style style = 2;
        repeated Block.Content.Text.Mark marks = 3;
        bool checked = 4;
        string lang = 5;
    }

    message MessageBlockLink {
        string targetObjectId = 1;
        LinkType type = 2;

        enum LinkType {
            Object = 0;
            File = 1;
            Image = 2;
            Bookmark = 3;
        }
    }

    message MessageBlockEmbed {
        string text = 1;
        Block.Content.Latex.Processor processor = 2;
    }

    message MessageBlockEditorQuote {
        string blockId = 1;           // ID 的 quoted block 在 source 对象
        MessageBlockText content = 2; // 【原文】quoted block content (text, style, marks, ...)
    }

    message MessageBlockMessageQuote {
        string messageId = 1;         // ID 的 quoted chat 消息
        string participantId = 2;     // ID 的 participant who authored quoted 消息
        MessageBlockText content = 3; // quoted 消息 content (text, style, marks,。..)
    }
}

enum SyncStatus {
    SyncStatusSynced  = 0;
    SyncStatusSyncing = 1;
    SyncStatusError   = 2;
    SyncStatusQueued  = 3;
}

enum SyncError {
    SyncErrorNull                = 0;
    SyncErrorIncompatibleVersion = 2;
    SyncErrorNetworkError        = 3;
    SyncErrorOversized           = 4;
}

enum TemplateNamePrefillType {
    Empty = 0;
    FromTemplateName = 1;
}

message Placeholder {
    string relationKey = 1;
    repeated Value values = 2;

    message Value {
        Type type = 1;
        google.protobuf.Value value = 2;
    }

    enum Type {
        PlaceholderValue = 0;
        PlaceholderToday = 1;
        PlaceholderCurrentUser = 2;
    }
}
